name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binary
        run: make build

      - name: Check binary size
        run: |
          SIZE=$(stat --format=%s bin/o3k 2>/dev/null || stat -f%z bin/o3k)
          SIZE_MB=$(($SIZE / 1048576))
          echo "Binary size: ${SIZE_MB}MB"
          if [ $SIZE -gt 68157440 ]; then
            echo "❌ Binary too large: ${SIZE_MB}MB (max 65MB)"
            exit 1
          fi
          echo "✅ Binary size OK: ${SIZE_MB}MB"

      - name: Run linters
        run: |
          go tool golangci-lint run ./...

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: o3k-binary
          path: bin/o3k
          retention-days: 7

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    # Postgres service so DB-backed unit tests (e.g. keystone admin bootstrap,
    # SPEC-007 WS-2) run instead of skipping. Tests connect via O3K_TEST_DB_URL.
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: o3k
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: o3k_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U o3k -d o3k_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests with race detector
        run: go test -race -coverprofile=coverage.txt -covermode=atomic $(go list ./... | grep -v '/test/contract')
        env:
          O3K_TEST_DB_URL: postgres://o3k:secret@localhost:5432/o3k_test?sslmode=disable

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-o3k

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Start O3K services
        run: |
          docker compose -f deployments/docker-compose.yml up -d
          sleep 10
          docker compose -f deployments/docker-compose.yml ps

      - name: Wait for O3K to be ready
        run: |
          echo "Waiting for all O3K services to be ready..."

          # Check with proper API version paths
          timeout 120 bash -c '
            until curl -sf http://localhost:35357/v3 > /dev/null 2>&1 && \
                  curl -sf http://localhost:8774/v2.1 > /dev/null 2>&1 && \
                  curl -sf http://localhost:9696/v2.0 > /dev/null 2>&1 && \
                  curl -sf http://localhost:8776/v3 > /dev/null 2>&1 && \
                  curl -sf http://localhost:9292/v2 > /dev/null 2>&1; do
              echo "⏳ Services not ready, retrying... ($(date +%H:%M:%S))"
              sleep 3
            done
          '

          echo "✅ All O3K services are ready"

      - name: Run contract tests
        continue-on-error: true
        id: contract_tests
        run: |
          cd test/contract && go test -v ./... -count=1 -timeout=10m 2>&1 | tee /tmp/contract_test_output.txt
        env:
          OS_AUTH_URL: "http://localhost:35357/v3"
          OS_USERNAME: "admin"
          OS_PASSWORD: "secret"
          OS_PROJECT_NAME: "default"
          OS_USER_DOMAIN_NAME: "Default"
          OS_PROJECT_DOMAIN_NAME: "Default"

      - name: Check contract test results
        run: |
          # Parse test results
          PASSED=$(grep -c "PASS:" /tmp/contract_test_output.txt || true)
          FAILED=$(grep -c "FAIL:" /tmp/contract_test_output.txt || true)
          SKIPPED=$(grep -c "SKIP:" /tmp/contract_test_output.txt || true)
          TOTAL=$((PASSED + FAILED + SKIPPED))

          if [ $TOTAL -eq 0 ]; then
            echo "⚠️  Unable to parse test results, using run/fail counts"
            PASSED=$(grep -c "^--- PASS:" /tmp/contract_test_output.txt || true)
            FAILED=$(grep -c "^--- FAIL:" /tmp/contract_test_output.txt || true)
            SKIPPED=$(grep -c "^--- SKIP:" /tmp/contract_test_output.txt || true)
            TOTAL=$((PASSED + FAILED + SKIPPED))
          fi

          echo "📊 Contract Test Results:"
          echo "   Total: $TOTAL"
          echo "   Passed: $PASSED"
          echo "   Failed: $FAILED"
          echo "   Skipped: $SKIPPED"

          if [ $TOTAL -eq 0 ]; then
            echo "❌ No tests were executed"
            exit 1
          fi

          # Calculate pass rate
          PASS_RATE=$((PASSED * 100 / TOTAL))
          echo "   Pass Rate: ${PASS_RATE}%"

          # Target: 90% pass rate (258/286 tests)
          # Acceptable: 85%+ (allows for minor regressions)
          if [ $PASS_RATE -ge 85 ]; then
            echo "✅ Contract tests meet quality threshold (${PASS_RATE}% >= 85%)"
            echo "ℹ️  Current milestone: 90% achieved (258/286)"
            echo "ℹ️  See CONTRACT_TEST_RESULTS.md for details"
          else
            echo "❌ Contract tests below quality threshold (${PASS_RATE}% < 85%)"
            echo "ℹ️  This indicates a regression from the 90% milestone"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose -f deployments/docker-compose.yml down -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start O3K services
        run: |
          docker compose -f deployments/docker-compose.yml up -d
          sleep 15
          docker compose -f deployments/docker-compose.yml ps

      - name: Wait for O3K to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:35357/v3 > /dev/null; do sleep 2; done'

      - name: Install OpenStack CLI
        run: |
          python3 -m pip install python-openstackclient

      - name: Run quick integration tests
        run: |
          if [ -f test/quick_test.sh ]; then
            chmod +x test/quick_test.sh
            ./test/quick_test.sh
          else
            echo "⚠️  No quick_test.sh found, skipping"
          fi
        env:
          OS_AUTH_URL: http://localhost:35357/v3
          OS_USERNAME: admin
          OS_PASSWORD: secret
          OS_PROJECT_NAME: default
          OS_USER_DOMAIN_NAME: Default
          OS_PROJECT_DOMAIN_NAME: Default

      - name: Cleanup
        if: always()
        run: docker compose -f deployments/docker-compose.yml down -v

  rgw-integration-tests:
    name: Ceph RGW (S3) Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start o3k + Postgres + real Ceph RGW (ceph/demo)
        run: |
          docker compose -p o3k-rgwtest -f deployments/docker-compose.rgw-test.yml up -d --build
          docker compose -p o3k-rgwtest -f deployments/docker-compose.rgw-test.yml ps

      - name: Wait for o3k Keystone
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:45357/v3 > /dev/null; do sleep 3; done'

      - name: Wait for RGW→Keystone wireup (capability B)
        run: |
          timeout 240 bash -c 'until docker compose -p o3k-rgwtest -f deployments/docker-compose.rgw-test.yml logs rgw 2>/dev/null | grep -q "wireup complete"; do sleep 3; done'

      - name: Install test clients (OpenStack CLI + boto3)
        run: |
          python3 -m pip install python-openstackclient boto3

      - name: Capability A — Glance images on Ceph RGW (upload/download + large stream)
        run: |
          chmod +x test/rgw_integration_test.sh
          ./test/rgw_integration_test.sh
        env:
          O3K_TEST_IMAGE_SIZE: 256M

      - name: Capability B — Tenant object storage via /v3/s3tokens (auth + isolation + revocation)
        run: |
          chmod +x test/tenant_s3_rgw_test.sh
          ./test/tenant_s3_rgw_test.sh

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose -p o3k-rgwtest -f deployments/docker-compose.rgw-test.yml logs --tail 300

      - name: Cleanup
        if: always()
        run: docker compose -p o3k-rgwtest -f deployments/docker-compose.rgw-test.yml down -v

  # TODO: Add e2e-fast and e2e-full jobs once E2E test scenarios are implemented.
  # Planned: VM lifecycle, volume attach/detach, network isolation, Terraform validation, Horizon UI tests.

  dco-check:
    name: SAP Sign-off Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify all commits are signed off by an @sap.com address
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          MISSING=""
          while IFS= read -r sha; do
            body=$(git log -1 --format='%B' "$sha")
            if ! echo "$body" | grep -qiE '^Signed-off-by: .+ <[^@>]+@sap\.com>'; then
              MISSING="$MISSING\n  $sha  $(git log -1 --format='%s' "$sha")"
            fi
          done < <(git log --format='%H' "$BASE..$HEAD")

          if [ -n "$MISSING" ]; then
            echo "❌ The following commits are missing a valid 'Signed-off-by: Name <name@sap.com>' trailer:"
            echo -e "$MISSING"
            echo ""
            echo "Fix with: git commit --amend --signoff  (then force-push)"
            echo "Or reword all at once: git rebase --signoff $BASE"
            exit 1
          fi

          echo "✅ All commits carry a Signed-off-by @sap.com trailer"

  status-check:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build, unit-tests, contract-tests, integration-tests, dco-check, rgw-integration-tests]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Build: ${{ needs.build.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Contract Tests: ${{ needs.contract-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "SAP Sign-off: ${{ needs.dco-check.result }}"
          echo "RGW Integration Tests: ${{ needs.rgw-integration-tests.result }}"

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi

          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi

          if [ "${{ needs.contract-tests.result }}" != "success" ]; then
            echo "⚠️  Contract tests did not pass quality gate"
            echo "ℹ️  Expected: 90% pass rate (258/286 tests)"
            echo "ℹ️  See CONTRACT_TEST_RESULTS.md for known gaps"
            exit 1
          fi

          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "❌ Integration tests failed"
            exit 1
          fi

          if [ "${{ needs.dco-check.result }}" != "success" ]; then
            echo "❌ SAP sign-off check failed — all commits need Signed-off-by: name@sap.com"
            exit 1
          fi

          if [ "${{ needs.rgw-integration-tests.result }}" != "success" ]; then
            echo "❌ Ceph RGW (S3) integration tests failed"
            exit 1
          fi

          echo "✅ All CI checks passed"
