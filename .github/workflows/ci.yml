name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binary
        run: make build

      - name: Check binary size
        run: |
          SIZE=$(stat --format=%s bin/lightstack 2>/dev/null || stat -f%z bin/lightstack)
          SIZE_MB=$(($SIZE / 1048576))
          echo "Binary size: ${SIZE_MB}MB"
          if [ $SIZE -gt 104857600 ]; then
            echo "❌ Binary too large: ${SIZE_MB}MB (max 100MB)"
            exit 1
          fi
          echo "✅ Binary size OK: ${SIZE_MB}MB"

      - name: Run linters
        run: make lint

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: lightstack-binary
          path: bin/lightstack
          retention-days: 7

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    # Postgres service so DB-backed unit tests (e.g. keystone admin bootstrap,
    # SPEC-007 WS-2) run instead of skipping. Tests connect via LIGHTSTACK_TEST_DB_URL.
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: lightstack
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: lightstack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lightstack -d lightstack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install qemu-img for image normalization tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils

      - name: Run unit tests with race detector
        run: go test -race -coverprofile=coverage.txt -covermode=atomic $(go list ./... | grep -v '/test/contract')
        env:
          LIGHTSTACK_TEST_DB_URL: postgres://lightstack:secret@localhost:5432/lightstack_test?sslmode=disable

      # The same tests on SQLite. Every package gets a fresh file of its own next to the one
      # named here (dbtest.URL), so packages running in parallel never share one.
      - name: Run unit tests on SQLite
        run: go test -race -count=1 $(go list ./... | grep -v '/test/contract')
        env:
          LIGHTSTACK_TEST_DB_URL: sqlite://${{ runner.temp }}/ls-test/t.db

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-lightstack

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Start lightstack services
        run: |
          docker compose -f deployments/docker-compose.yml up -d
          sleep 10
          docker compose -f deployments/docker-compose.yml ps

      - name: Wait for lightstack to be ready
        run: |
          echo "Waiting for all Lightstack services to be ready..."

          # Check with proper API version paths
          timeout 120 bash -c '
            until curl -sf http://localhost:35357/v3 > /dev/null 2>&1 && \
                  curl -sf http://localhost:8774/v2.1 > /dev/null 2>&1 && \
                  curl -sf http://localhost:9696/v2.0 > /dev/null 2>&1 && \
                  curl -sf http://localhost:8776/v3 > /dev/null 2>&1 && \
                  curl -sf http://localhost:9292/v2 > /dev/null 2>&1; do
              echo "⏳ Services not ready, retrying... ($(date +%H:%M:%S))"
              sleep 3
            done
          '

          echo "✅ All Lightstack services are ready"

      - name: Run contract tests
        continue-on-error: true
        id: contract_tests
        run: |
          cd test/contract && go test -v ./... -count=1 -timeout=10m 2>&1 | tee /tmp/contract_test_output.txt
        env:
          # The fixtures the API cannot create are seeded straight into the server's database.
          LIGHTSTACK_DB_URL: "postgres://lightstack:secret@localhost:5432/lightstack?sslmode=disable"
          OS_AUTH_URL: "http://localhost:35357/v3"
          OS_USERNAME: "admin"
          OS_PASSWORD: "secret"
          OS_PROJECT_NAME: "default"
          OS_USER_DOMAIN_NAME: "Default"
          OS_PROJECT_DOMAIN_NAME: "Default"

      - name: Check contract test results
        run: |
          # Parse test results
          PASSED=$(grep -c "PASS:" /tmp/contract_test_output.txt || true)
          FAILED=$(grep -c "FAIL:" /tmp/contract_test_output.txt || true)
          SKIPPED=$(grep -c "SKIP:" /tmp/contract_test_output.txt || true)
          TOTAL=$((PASSED + FAILED + SKIPPED))

          if [ $TOTAL -eq 0 ]; then
            echo "⚠️  Unable to parse test results, using run/fail counts"
            PASSED=$(grep -c "^--- PASS:" /tmp/contract_test_output.txt || true)
            FAILED=$(grep -c "^--- FAIL:" /tmp/contract_test_output.txt || true)
            SKIPPED=$(grep -c "^--- SKIP:" /tmp/contract_test_output.txt || true)
            TOTAL=$((PASSED + FAILED + SKIPPED))
          fi

          echo "📊 Contract Test Results:"
          echo "   Total: $TOTAL"
          echo "   Passed: $PASSED"
          echo "   Failed: $FAILED"
          echo "   Skipped: $SKIPPED"

          if [ $TOTAL -eq 0 ]; then
            echo "❌ No tests were executed"
            exit 1
          fi

          # Calculate pass rate
          PASS_RATE=$((PASSED * 100 / TOTAL))
          echo "   Pass Rate: ${PASS_RATE}%"

          # Target: 90% pass rate (258/286 tests)
          # Acceptable: 85%+ (allows for minor regressions)
          if [ $PASS_RATE -ge 85 ]; then
            echo "✅ Contract tests meet quality threshold (${PASS_RATE}% >= 85%)"
            echo "ℹ️  Current milestone: 90% achieved (258/286)"
            echo "ℹ️  See CONTRACT_TEST_RESULTS.md for details"
          else
            echo "❌ Contract tests below quality threshold (${PASS_RATE}% < 85%)"
            echo "ℹ️  This indicates a regression from the 90% milestone"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose -f deployments/docker-compose.yml down -v

  contract-tests-sqlite:
    name: Contract Tests (SQLite)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      OS_AUTH_URL: http://localhost:35357/v3
      OS_USERNAME: admin
      OS_PASSWORD: secret
      OS_PROJECT_NAME: default
      OS_USER_DOMAIN_NAME: Default
      OS_PROJECT_DOMAIN_NAME: Default

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The `runner` context is not available in a job-level `env`, so name the database
      # here: read by the server and by the contract tests' fixture seeding (contract.Seed).
      - name: Name the SQLite database
        run: echo "LIGHTSTACK_DB_URL=sqlite://$RUNNER_TEMP/ls/db/lightstack.db" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: make build

      - name: Install volume and cloud-init tooling
        # storage_mode: local shells out to qemu-img, and cloud-init ISOs need genisoimage.
        # The Docker image the Postgres contract job runs bundles both (Dockerfile: qemu-img,
        # cdrkit); this job runs the raw binary, so install them on the runner. Without them a
        # volume create fails, the test gets an empty volume id, and follow-up actions fail the
        # volume_metadata foreign key.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils genisoimage

      # A stub-libvirt, stub-network server on a fresh SQLite file: no database service at all.
      - name: Start lightstack on SQLite
        run: |
          mkdir -p "$RUNNER_TEMP/ls/state"
          # LIGHTSTACK_DB_URL (set above) overrides database.url at load, so the file keeps
          # its default; only state_path is redirected out of /var/lib.
          sed -e "s|^# state_path: .*|state_path: $RUNNER_TEMP/ls/state|" \
              config/lightstack.yaml > "$RUNNER_TEMP/ls/lightstack.yaml"
          nohup ./bin/lightstack --config "$RUNNER_TEMP/ls/lightstack.yaml" --migrations migrations \
            > "$RUNNER_TEMP/ls/lightstack.log" 2>&1 &
        env:
          LIGHTSTACK_JWT_SECRET: ci-contract-tests-only
          LIGHTSTACK_ENDPOINT_HOST: localhost
          # Tests name the instance they ask the metadata service about (see the Compose file).
          LIGHTSTACK_METADATA_TRUST_INSTANCE_HEADER: "true"

      - name: Wait for lightstack to be ready
        run: timeout 60 bash -c 'until ./bin/lightstack healthcheck; do sleep 2; done'

      - name: Install OpenStack CLI
        run: python3 -m pip install python-openstackclient

      - name: Run contract tests
        run: cd test/contract && go test ./... -count=1 -timeout=10m

      - name: Run quick integration tests
        run: ./test/quick_test.sh

      - name: Server log
        if: always()
        # Surface every error line from the whole log first — a failing request's cause scrolls past
        # a 300-line tail — then tail the end, which also shows a startup log.Fatalf (plain text the
        # level filter would hide).
        run: |
          echo "=== error lines (whole log) ==="
          grep -F '"level":"error"' "$RUNNER_TEMP/ls/lightstack.log" || echo "(none)"
          echo "=== last 300 lines ==="
          tail -n 300 "$RUNNER_TEMP/ls/lightstack.log" || true

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-contract-lightstack-log
          path: ${{ runner.temp }}/ls/lightstack.log
          if-no-files-found: warn

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start lightstack services
        run: |
          docker compose -f deployments/docker-compose.yml up -d
          sleep 15
          docker compose -f deployments/docker-compose.yml ps

      - name: Wait for lightstack to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:35357/v3 > /dev/null; do sleep 2; done'

      - name: Install OpenStack CLI
        run: |
          python3 -m pip install python-openstackclient

      - name: Run quick integration tests
        run: |
          if [ -f test/quick_test.sh ]; then
            chmod +x test/quick_test.sh
            ./test/quick_test.sh
          else
            echo "⚠️  No quick_test.sh found, skipping"
          fi
        env:
          OS_AUTH_URL: http://localhost:35357/v3
          OS_USERNAME: admin
          OS_PASSWORD: secret
          OS_PROJECT_NAME: default
          OS_USER_DOMAIN_NAME: Default
          OS_PROJECT_DOMAIN_NAME: Default

      - name: Run Horizon create-UI probe
        # SPEC-020: what Horizon's create flows read before enabling a control, and the
        # create requests they then send (volume, network, instance launch, and the
        # Overview after a project switch). Removes everything it creates.
        run: make test-horizon-ui

      - name: Cleanup
        if: always()
        run: docker compose -f deployments/docker-compose.yml down -v

  rgw-integration-tests:
    name: Ceph RGW (S3/Swift) Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start lightstack + Postgres + real Ceph RGW (ceph/demo)
        run: |
          docker compose -p lightstack-rgwtest -f deployments/docker-compose.rgw-test.yml up -d --build
          docker compose -p lightstack-rgwtest -f deployments/docker-compose.rgw-test.yml ps

      - name: Wait for lightstack Keystone
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:45357/v3 > /dev/null; do sleep 3; done'

      - name: Wait for RGW→Keystone wireup (capability B)
        run: |
          timeout 240 bash -c 'until docker compose -p lightstack-rgwtest -f deployments/docker-compose.rgw-test.yml logs rgw 2>/dev/null | grep -q "wireup complete"; do sleep 3; done'

      - name: Install test clients (OpenStack CLI + boto3)
        run: |
          python3 -m pip install python-openstackclient boto3

      - name: Capability A — Glance images on Ceph RGW (upload/download + large stream)
        run: |
          chmod +x test/rgw_integration_test.sh
          ./test/rgw_integration_test.sh
        env:
          LIGHTSTACK_TEST_IMAGE_SIZE: 256M

      - name: Capability B — Tenant object storage via /v3/s3tokens (auth + isolation + revocation)
        run: |
          chmod +x test/tenant_s3_rgw_test.sh
          ./test/tenant_s3_rgw_test.sh

      - name: Capability C — Swift API via Keystone tokens (envelope + implicit tenants)
        run: |
          chmod +x test/swift_rgw_test.sh
          ./test/swift_rgw_test.sh

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose -p lightstack-rgwtest -f deployments/docker-compose.rgw-test.yml logs --tail 300

      - name: Cleanup
        if: always()
        run: docker compose -p lightstack-rgwtest -f deployments/docker-compose.rgw-test.yml down -v

  # TODO: Add e2e-fast and e2e-full jobs once E2E test scenarios are implemented.
  # Planned: VM lifecycle, volume attach/detach, network isolation, Terraform validation, Horizon UI tests.

  helm-check:
    name: Helm Charts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Same mechanism as `make install-tools`: the official get-helm-3 script plus the
      # helm-unittest plugin, which `make chart-test` hard-requires (Makefile:103-104).
      - name: Install Helm and the helm-unittest plugin
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            # Downloaded, not piped: the default run shell is `bash -e` without pipefail,
            # so `curl ... | bash` would swallow a failed download.
            curl -fsSL -o "$RUNNER_TEMP/get-helm-3" \
              https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
            bash "$RUNNER_TEMP/get-helm-3"
          fi
          if ! helm plugin list 2>/dev/null | grep -q '^unittest'; then
            # helm-unittest ships no provenance file; recent Helm refuses an
            # unverified plugin unless verification is explicitly skipped.
            helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
          fi
          helm version --short

      # Lints + renders + unit-tests both product charts: charts/lightstack, then
      # charts/horizon. Needs no cluster and no running Lightstack.
      - name: Lint, render and unit-test the Helm charts
        run: make chart-test

  dco-check:
    name: SAP Sign-off Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify all commits are signed off by an @sap.com address
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          MISSING=""
          while IFS= read -r sha; do
            body=$(git log -1 --format='%B' "$sha")
            if ! echo "$body" | grep -qiE '^Signed-off-by: .+ <[^@>]+@sap\.com>'; then
              MISSING="$MISSING\n  $sha  $(git log -1 --format='%s' "$sha")"
            fi
          done < <(git log --format='%H' "$BASE..$HEAD")

          if [ -n "$MISSING" ]; then
            echo "❌ The following commits are missing a valid 'Signed-off-by: Name <name@sap.com>' trailer:"
            echo -e "$MISSING"
            echo ""
            echo "Fix with: git commit --amend --signoff  (then force-push)"
            echo "Or reword all at once: git rebase --signoff $BASE"
            exit 1
          fi

          echo "✅ All commits carry a Signed-off-by @sap.com trailer"

  status-check:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build, unit-tests, contract-tests, contract-tests-sqlite, integration-tests, dco-check, rgw-integration-tests, helm-check]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Build: ${{ needs.build.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Contract Tests: ${{ needs.contract-tests.result }}"
          echo "Contract Tests (SQLite): ${{ needs.contract-tests-sqlite.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "SAP Sign-off: ${{ needs.dco-check.result }}"
          echo "RGW Integration Tests: ${{ needs.rgw-integration-tests.result }}"
          echo "Helm Charts: ${{ needs.helm-check.result }}"

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi

          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi

          if [ "${{ needs.contract-tests.result }}" != "success" ]; then
            echo "⚠️  Contract tests did not pass quality gate"
            echo "ℹ️  Expected: 90% pass rate (258/286 tests)"
            echo "ℹ️  See CONTRACT_TEST_RESULTS.md for known gaps"
            exit 1
          fi

          if [ "${{ needs.contract-tests-sqlite.result }}" != "success" ]; then
            echo "❌ Contract or quick tests failed on SQLite"
            exit 1
          fi

          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "❌ Integration tests failed"
            exit 1
          fi

          if [ "${{ needs.dco-check.result }}" != "success" ]; then
            echo "❌ SAP sign-off check failed — all commits need Signed-off-by: name@sap.com"
            exit 1
          fi

          if [ "${{ needs.rgw-integration-tests.result }}" != "success" ]; then
            echo "❌ Ceph RGW (S3) integration tests failed"
            exit 1
          fi

          if [ "${{ needs.helm-check.result }}" != "success" ]; then
            echo "❌ Helm chart lint/render/unittest failed — run 'make chart-test' locally"
            exit 1
          fi

          echo "✅ All CI checks passed"
