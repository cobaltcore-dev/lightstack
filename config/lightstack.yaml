# Node-local state root for real mode (pkg/paths). Absolute, and the same path the host
# sees: libvirtd opens the paths Lightstack writes into the domain XML.
# state_path: /var/lib/lightstack

database:
  url: "postgres://lightstack:secret@localhost/lightstack?sslmode=disable"
  max_connections: 50  # Increased from 20 for higher concurrency
  min_connections: 2   # Keep minimal warm connections
  max_conn_lifetime: 1h
  max_conn_idle_time: 10m  # Reduced from 15m for aggressive cleanup
  health_check_period: 30s # Reduced from 1m for faster failure detection

keystone:
  port: 35357
  jwt_secret: "change-me-in-production"
  token_ttl: 24h
  # Admin account, applied at startup as a FIRST-BOOT SEED (SPEC-007 WS-2):
  #   - admin_password is written only when the account is absent or still
  #     carries the well-known default `secret`; once changed it is never
  #     overwritten (rotate via the OpenStack Identity API, not config).
  #   - If admin_user is set to a name other than `admin`, the seeded `admin`
  #     account is disabled. CHANGE admin_password for any exposed deployment.
  admin_user: admin
  admin_password: secret
  # Ceph RGW (Swift) compatibility, default off. With Keystone integration and
  # rgw_keystone_implicit_tenants, RGW derives the Swift tenant name and the
  # implicit user id (<project>$<project>) from the Keystone token's project id,
  # and validates tenant names against [A-Za-z0-9_] ONLY (rgw_validate_tenant_name,
  # ceph src/rgw/rgw_user.cc) — hyphens are rejected with ERR_INVALID_TENANT_NAME,
  # so hyphenated OpenStack-style UUID project ids cannot back RGW tenants.
  # When true, the token payload's project id (token.project.id) is rendered
  # in OpenStack's established dash-free form everywhere Ceph RGW derives a
  # tenant from it: the /v3/auth/tokens responses (POST password issue, POST
  # re-scope, and the GET validation response) and the /v3/s3tokens response's
  # project.id. The EC2 credential endpoint accepts the dash-free tenant_id as
  # input and stores the canonical database UUID. Everything else keeps canonical hyphenated
  # UUIDs: management APIs, database storage, JWT signing/verification,
  # token.user.id, token.project.name, token.project.domain, role lists, and
  # the service catalog (nova endpoint URLs etc.).
  # Caveat: clients that read token.project.id out of the auth response see
  # the dash-free form while the flag is on — take canonical project ids from
  # the management APIs (GET /v3/projects) when an internal UUID is required.
  # S3 already uses the dash-free form, so enabling the flag does not re-key
  # existing S3 data; it makes Swift use the same tenant namespace.
  # Env override: LIGHTSTACK_KEYSTONE_RGW_COMPAT_TENANT_IDS (true/false).
  rgw_compat_tenant_ids: false
  # Advertised service-catalog / self-link scheme is set via the
  # LIGHTSTACK_ENDPOINT_SCHEME environment variable (http|https, default http),
  # alongside LIGHTSTACK_ENDPOINT_HOST — see .env.example.

compute:
  # Node identifier - auto-generates UUID if set to "auto"
  node_id: auto
  # Tunnel IP for VXLAN - auto-detects if set to "auto"
  tunnel_ip: auto
  # VXLAN UDP port (default: 4789)
  vxlan_port: 4789
  # Heartbeat interval for node registry
  heartbeat_interval: 30s

nova:
  port: 8774
  libvirt_uri: "qemu:///system"
  default_flavor: m1.small
  libvirt_mode: stub  # "stub" or "real"

  # noVNC console (SPEC-021). Real mode only: stub mode has no guest, so the console
  # API refuses at request time instead of returning a link that leads nowhere.
  #
  # Browser-reachable ORIGIN of the console proxy — "scheme://host:port", NO path.
  # Lightstack appends the client page and the token query itself, so they cannot drift from
  # the deployed noVNC version. Empty derives it from the request. Anything more than an
  # origin — e.g. upstream Nova's ".../vnc_auto.html" form — fails startup.
  console_proxy_base_url: ""
  # How long an issued console link stays usable. The effective ceiling is this plus
  # console_reconcile_interval: the proxy performs no expiry check of its own, so a
  # token dies when Lightstack removes its projection entry, not the instant it expires.
  console_token_ttl: 10m
  # How often expired console tokens are reaped. This is what ENFORCES expiry.
  console_reconcile_interval: 30s

neutron:
  port: 9696
  dhcp_lease_time: 24h
  iptables_enabled: true
  networking_mode: stub  # "stub", "iptables", or "ebpf"

  # Security group backend (eBPF requires networking_mode: "real" or "ebpf")
  security_group_mode: stub  # "stub", "iptables", or "ebpf"
  ebpf_object_path: "pkg/networking/ebpf/secgroup.o"  # Path to compiled eBPF object

  # VXLAN overlay networking for multi-node
  vxlan_enabled: false
  vni_range_start: 1000
  vni_range_end: 10000
  coordination_poll_interval: 1s
  vxlan_mtu: 1450

  # Real-mode network-state reconciler (WS-2): resync interval for rebuilding
  # DHCP/namespaces/bridges/security-group rules from the database on startup
  # and periodically (self-heals drift). Only runs when networking_mode != stub.
  reconcile_interval: 30s

cinder:
  port: 8776
  ceph_pool: volumes
  ceph_conf: /etc/ceph/ceph.conf
  storage_mode: local  # "stub", "local", "rbd", or "local,rbd"

glance:
  port: 9292
  ceph_pool: images
  ceph_conf: /etc/ceph/ceph.conf
  storage_mode: local  # "stub", "local", "rbd", "s3", "local,rbd", "local,s3" ("rbd,s3" unsupported: no Glance RBD backend)
  s3_bucket: ""       # S3 bucket name (required for s3 mode)
  s3_region: us-east-1  # S3 region
  s3_endpoint: ""     # Custom S3 endpoint (for MinIO, Ceph RGW, etc.)

metadata:
  # Address the metadata service binds. In real mode it must be reachable from
  # tenant network namespaces (the per-namespace 169.254.169.254 DNAT targets
  # it); localhost is dev/stub only.
  bind_address: "0.0.0.0:8775"
  # Believe the X-Instance-ID header from any caller, not only loopback. Guests are
  # identified by their address; the header lets tests name an instance instead. Test
  # stacks only, where requests do not arrive from loopback (Docker port mapping presents
  # them from the bridge gateway). Never enable it where real guests reach this service:
  # any of them could then read any instance's metadata and user-data.
  # Env: LIGHTSTACK_METADATA_TRUST_INSTANCE_HEADER.
  trust_instance_header: false

server:
  cors_allowed_origins:
    - "http://localhost"
    - "http://localhost:3000"

logging:
  level: info
  format: json

cache:
  enabled: false  # Set to true to enable Redis caching
  redis_url: "redis://localhost:6379/0"
  key_prefix: "lightstack:"
  default_ttl: 1h

  # Per-resource TTL overrides (optional)
  ttl:
    flavors: 24h        # Flavors rarely change
    images: 1h          # Images change occasionally
    networks: 30m       # Networks change more frequently
    service_catalog: 24h # Service catalog is static

# Rate limiting (v0.7.0+)
# Two-tier: IP-based for auth endpoints, project-based for API endpoints
# See docs/adr/ADR-002-rate-limiting-architecture.md
rate_limiting:
  enabled: false              # Set to true to enable rate limiting
  auth_rate: 20               # Requests per minute per IP (unauthenticated endpoints)
  api_rate: 100               # Requests per minute per project (authenticated endpoints)
  eviction_interval: 10m      # Cleanup interval for stale entries
  max_entries: 10000           # Maximum tracked IPs/projects
  overflow_policy: allow       # "allow" or "deny" when max_entries exceeded
