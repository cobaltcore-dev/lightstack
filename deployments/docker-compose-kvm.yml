services:
  lightstack:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    container_name: lightstack
    privileged: true
    network_mode: host
    volumes:
      # The socket's directory, not the socket: a bind of the file keeps its inode, so a
      # libvirtd that re-creates its socket would stay unreachable until a restart.
      - /var/run/libvirt:/var/run/libvirt
      # The whole node-local state root, at the same path inside and out: libvirtd on the
      # host opens the paths Lightstack writes into each domain's XML — disks, config-drive
      # ISOs, and the VNC socket QEMU creates even with no console proxy running (SPEC-021
      # FR-017a) — and a SQLite database lives in its db/ directory. Set
      # LIGHTSTACK_STATE_PATH to the config's state_path when that is not the default.
      - ${LIGHTSTACK_STATE_PATH:-/var/lib/lightstack}:${LIGHTSTACK_STATE_PATH:-/var/lib/lightstack}
      - ${LIGHTSTACK_CONFIG_DIR:-/opt/lightstack/config}:/opt/lightstack/config:ro
    environment:
      # Overrides the config's database.url when set — postgres://… or
      # sqlite:///<state_path>/db/lightstack.db; empty keeps the config's.
      LIGHTSTACK_DB_URL: ${LIGHTSTACK_DB_URL:-}
    # metadata.trust_instance_header (LIGHTSTACK_METADATA_TRUST_INSTANCE_HEADER) stays
    # unset here on purpose. It makes the metadata service believe an X-Instance-ID header
    # from any caller, which only test stacks without real guests may allow: real guests
    # reach this service, and any of them could then read any instance's metadata and
    # user-data. With host networking, host-run tests reach it over loopback, where the
    # header is believed anyway.
    command: [/app/lightstack, -config, /opt/lightstack/config/lightstack.yaml]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "curl -f http://localhost:35357/v3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
