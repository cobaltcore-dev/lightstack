services:
  lightstack:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    container_name: lightstack
    privileged: true
    network_mode: host
    volumes:
      # The socket's directory, not the socket: a bind of the file keeps its inode, so a
      # libvirtd that re-creates its socket would stay unreachable until a restart.
      - /var/run/libvirt:/var/run/libvirt
      - /var/lib/lightstack/volumes:/var/lib/lightstack/volumes
      - /var/lib/lightstack/images:/var/lib/lightstack/images
      - /var/lib/lightstack/instances:/var/lib/lightstack/instances
      - /opt/lightstack/config:/opt/lightstack/config:ro
    # metadata.trust_instance_header (LIGHTSTACK_METADATA_TRUST_INSTANCE_HEADER) stays
    # unset here on purpose. It makes the metadata service believe an X-Instance-ID header
    # from any caller, which only test stacks without real guests may allow: real guests
    # reach this service, and any of them could then read any instance's metadata and
    # user-data. With host networking, host-run tests reach it over loopback, where the
    # header is believed anyway.
    command: [/app/lightstack, -config, /opt/lightstack/config/lightstack.yaml]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "curl -f http://localhost:35357/v3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
