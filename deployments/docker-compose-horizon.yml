version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.4-alpine
    container_name: lightstack-postgres
    hostname: postgres
    environment:
      # See deployments/docker-compose.yml — the identity of a retained volume wins
      # over the file's defaults (cloud-storage#575).
      POSTGRES_DB: ${POSTGRES_DB:-lightstack}
      POSTGRES_USER: ${POSTGRES_USER:-lightstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - lightstack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightstack}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Memcached for Horizon Sessions
  memcached:
    image: memcached:1.6-alpine
    container_name: lightstack-memcached
    hostname: memcached
    command: memcached -m 64
    networks:
      - lightstack-network
    restart: unless-stopped

  # Lightstack OpenStack Services
  lightstack:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    image: lightstack:latest
    container_name: lightstack
    hostname: lightstack
    ports:
      - "35357:35357" # Keystone (Identity)
      - "8774:8774" # Nova (Compute)
      - "9696:9696" # Neutron (Network)
      - "8776:8776" # Cinder (Block Storage)
      - "9292:9292" # Glance (Image)
      - "8775:8775" # Metadata Service
    environment:
      - LIGHTSTACK_DB_URL=postgres://${POSTGRES_USER:-lightstack}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-lightstack}?sslmode=disable
      - LIGHTSTACK_JWT_SECRET=${LIGHTSTACK_JWT_SECRET:?LIGHTSTACK_JWT_SECRET must be set}
      - LIGHTSTACK_ENDPOINT_HOST=lightstack
    volumes:
      - lightstack-data:/var/lib/lightstack
      - lightstack-images:/var/lib/lightstack/images
      - lightstack-volumes:/var/lib/lightstack/volumes
    networks:
      - lightstack-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:35357/v3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # OpenStack Horizon Dashboard (Flamingo 2025.2)
  horizon:
    image: quay.io/openstack.kolla/horizon:2026.2-ubuntu-noble
    container_name: lightstack-horizon
    hostname: horizon
    ports:
      # Host port is parametrized so rootless Podman can remap off privileged :80.
      # Defaults to 80 (unchanged for Docker/root users): export HORIZON_HTTP_PORT=8080 to remap.
      - "${HORIZON_HTTP_PORT:-80}:80"
    environment:
      - KOLLA_INSTALL_TYPE=source
      - KOLLA_CONFIG_STRATEGY=COPY_ALWAYS
      # Django signs CSRF tokens with this; apache runs processes=3, so every worker must get
      # the SAME value, or a token minted by one worker is rejected by the others. A labelled lab
      # default (as with POSTGRES_PASSWORD above, and the chart's horizon.secretKey) keeps every
      # caller of this file working — scripts/start_validation.sh, README, QUICK_REFERENCE and
      # UNIFIED_DEPLOYMENT all drive it without exporting anything. Override beyond a lab.
      - SECRET_KEY=${HORIZON_SECRET_KEY:-lightstack-horizon-lab-only-change-me}
      # local_settings defaults DEBUG to False; the dev stack opts in so a 500 shows a traceback.
      - HORIZON_DEBUG=${HORIZON_DEBUG:-True}
      - HORIZON_ALLOWED_HOSTS=${HORIZON_ALLOWED_HOSTS:-*}
    volumes:
      - ./horizon-config/config.json:/var/lib/kolla/config_files/config.json:ro
      - ./horizon-config/local_settings:/var/lib/kolla/config_files/local_settings:ro
      - ./horizon-config/apache/ports.conf:/var/lib/kolla/config_files/ports.conf:ro
      - ./horizon-config/apache/horizon-nolist.conf:/var/lib/kolla/config_files/horizon-nolist.conf:ro
      - horizon-static:/var/lib/kolla/venv/lib/python3.12/site-packages/static:rw
      - horizon-logs:/var/log/kolla/horizon:rw
    networks:
      - lightstack-network
    depends_on:
      lightstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/dashboard/auth/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # No noVNC console here: this is the STUB stack, and stub mode refuses console
  # requests at the API with 501 (there is no guest to display). The working proxy
  # is deployed by charts/lightstack in real mode (SPEC-021).

networks:
  lightstack-network:
    driver: bridge
    name: lightstack-horizon-network

volumes:
  postgres-data:
  lightstack-data:
  lightstack-images:
  lightstack-volumes:
  horizon-static:
  horizon-logs:
