version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.4-alpine
    container_name: o3k-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: o3k
      POSTGRES_USER: o3k
      # Also interpolated into o3k's O3K_DB_URL below: both MUST carry the same default, or
      # setting POSTGRES_PASSWORD initialises the DB with one password and o3k dials the other.
      # Keep the value free of characters needing percent-encoding in a postgres:// DSN.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - o3k-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U o3k"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Memcached for Horizon Sessions
  memcached:
    image: memcached:1.6-alpine
    container_name: o3k-memcached
    hostname: memcached
    command: memcached -m 64
    networks:
      - o3k-network
    restart: unless-stopped

  # O3K OpenStack Services
  o3k:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    image: o3k:latest
    container_name: o3k
    hostname: o3k
    ports:
      - "35357:35357" # Keystone (Identity)
      - "8774:8774" # Nova (Compute)
      - "9696:9696" # Neutron (Network)
      - "8776:8776" # Cinder (Block Storage)
      - "9292:9292" # Glance (Image)
      - "8775:8775" # Metadata Service
    environment:
      - O3K_DB_URL=postgres://o3k:${POSTGRES_PASSWORD:-secret}@postgres:5432/o3k?sslmode=disable
      - O3K_JWT_SECRET=${O3K_JWT_SECRET:?O3K_JWT_SECRET must be set}
      - O3K_ENDPOINT_HOST=o3k
    volumes:
      - o3k-data:/var/lib/o3k
      - o3k-images:/var/lib/o3k/images
      - o3k-volumes:/var/lib/o3k/volumes
    networks:
      - o3k-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:35357/v3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # OpenStack Horizon Dashboard (Flamingo 2025.2)
  horizon:
    image: quay.io/openstack.kolla/horizon:2025.2-ubuntu-noble
    container_name: o3k-horizon
    hostname: horizon
    ports:
      # Host port is parametrized so rootless Podman can remap off privileged :80.
      # Defaults to 80 (unchanged for Docker/root users): export HORIZON_HTTP_PORT=8080 to remap.
      - "${HORIZON_HTTP_PORT:-80}:80"
    environment:
      - KOLLA_INSTALL_TYPE=source
      - KOLLA_CONFIG_STRATEGY=COPY_ALWAYS
      # Django signs CSRF tokens with this; apache runs processes=3, so every worker must get
      # the SAME value, or a token minted by one worker is rejected by the others. Required, in
      # the same shape as O3K_JWT_SECRET above.
      - SECRET_KEY=${HORIZON_SECRET_KEY:?HORIZON_SECRET_KEY must be set}
      # local_settings defaults DEBUG to False; the dev stack opts in so a 500 shows a traceback.
      - HORIZON_DEBUG=${HORIZON_DEBUG:-True}
      - HORIZON_ALLOWED_HOSTS=${HORIZON_ALLOWED_HOSTS:-*}
    volumes:
      - ./horizon-config/config.json:/var/lib/kolla/config_files/config.json:ro
      - ./horizon-config/local_settings:/var/lib/kolla/config_files/local_settings:ro
      - ./horizon-config/apache/ports.conf:/var/lib/kolla/config_files/ports.conf:ro
      - ./horizon-config/apache/horizon-nolist.conf:/var/lib/kolla/config_files/horizon-nolist.conf:ro
      - horizon-static:/var/lib/kolla/venv/lib/python3.12/site-packages/static:rw
      - horizon-logs:/var/log/kolla/horizon:rw
    networks:
      - o3k-network
    depends_on:
      o3k:
        condition: service_healthy
      novnc:
        # service_started, NOT service_healthy — deliberate. novnc reports unhealthy by design
        # (dead VNC target, F1) and Horizon degrades fine without the console tab. See the novnc
        # service below before changing this.
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/dashboard/auth/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # No noVNC console here: this is the STUB stack, and stub mode refuses console
  # requests at the API with 501 (there is no guest to display). The working proxy
  # is deployed by charts/o3k in real mode (SPEC-021).

networks:
  o3k-network:
    driver: bridge
    name: o3k-horizon-network

volumes:
  postgres-data:
  o3k-data:
  o3k-images:
  o3k-volumes:
  horizon-static:
  horizon-logs:
