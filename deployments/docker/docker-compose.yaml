version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: lightstack-postgres
    environment:
      # See deployments/docker-compose.yml — the identity of a retained volume wins
      # over the file's defaults (cloud-storage#575).
      POSTGRES_DB: ${POSTGRES_DB:-lightstack}
      POSTGRES_USER: ${POSTGRES_USER:-lightstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightstack}"]
      interval: 5s
      timeout: 5s
      retries: 5

  lightstack:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: lightstack
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"  # Keystone
      - "8774:8774"  # Nova
      - "9696:9696"  # Neutron
      - "8776:8776"  # Cinder
      - "9292:9292"  # Glance
    environment:
      LIGHTSTACK_DB_URL: "postgres://${POSTGRES_USER:-lightstack}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-lightstack}?sslmode=disable"
      LIGHTSTACK_JWT_SECRET: "${LIGHTSTACK_JWT_SECRET:-change-me-in-production}"
      # Dev-only escape hatch: the binary refuses the well-known default
      # secret above unless this is set (review S2). This stack is for local
      # stub-mode development — NEVER set it where real guests or foreign
      # clients reach the services: pass a real LIGHTSTACK_JWT_SECRET instead.
      # Defaults ON for dev but is overridable: when you pass a real
      # LIGHTSTACK_JWT_SECRET, set this to false/0 to re-arm the guard.
      LIGHTSTACK_ALLOW_INSECURE_DEFAULT_SECRET: "${LIGHTSTACK_ALLOW_INSECURE_DEFAULT_SECRET:-true}"
    volumes:
      # For libvirt access (if running on same host)
      - /var/run/libvirt:/var/run/libvirt:ro
      # For network namespace operations
      - /var/run/netns:/var/run/netns
    # Uncomment for privileged operations (netlink, namespaces)
    # privileged: true
    # cap_add:
    #   - NET_ADMIN
    #   - SYS_ADMIN
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
