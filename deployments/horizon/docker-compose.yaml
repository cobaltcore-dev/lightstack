services:
  postgres:
    image: postgres:18-alpine
    container_name: lightstack-postgres
    environment:
      # See deployments/docker-compose.yml — the identity of a retained volume wins
      # over the file's defaults (cloud-storage#575).
      POSTGRES_DB: ${POSTGRES_DB:-lightstack}
      POSTGRES_USER: ${POSTGRES_USER:-lightstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightstack}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lightstack-network

  # Lightstack is already running on your host, so we'll connect to it via host.docker.internal
  # If you want to run Lightstack in Docker instead, uncomment the section below

  # lightstack:
  #   build:
  #     context: ../..
  #     dockerfile: deployments/docker/Dockerfile
  #   container_name: lightstack
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   ports:
  #     - "35357:35357"  # Keystone
  #     - "8774:8774"    # Nova
  #     - "9696:9696"    # Neutron
  #     - "8776:8776"    # Cinder
  #     - "9292:9292"    # Glance
  #     - "8775:8775"    # Metadata
  #   environment:
  #     LIGHTSTACK_DB_URL: "postgres://${POSTGRES_USER:-lightstack}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-lightstack}?sslmode=disable"
  #     LIGHTSTACK_JWT_SECRET: "${LIGHTSTACK_JWT_SECRET:-change-me-in-production}"
  #   networks:
  #     - lightstack-network
  #   restart: unless-stopped

  horizon:
    image: tenstartups/openstack-horizon:latest
    container_name: lightstack-horizon
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Connect to Lightstack running on host machine
      KOLLA_SERVICE_NAME: horizon
    volumes:
      - ./horizon_settings.py:/etc/openstack-dashboard/local_settings.d/_10_custom.py:ro
      - horizon_static:/var/lib/kolla/venv/lib/python3.*/site-packages/static
    networks:
      - lightstack-network
    extra_hosts:
      # Allow container to reach host services
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/dashboard/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  horizon_static:
    driver: local

networks:
  lightstack-network:
    driver: bridge
