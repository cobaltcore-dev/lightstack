version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18.4-alpine
    container_name: lightstack-postgres
    environment:
      # Read from the environment so an upgrade onto a retained volume can keep the
      # identity that volume was initialised with — initdb honours these only on an
      # empty data directory (cloud-storage#575). Defaults are the current names.
      POSTGRES_DB: ${POSTGRES_DB:-lightstack}
      POSTGRES_USER: ${POSTGRES_USER:-lightstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightstack}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lightstack-network

  # Redis Cache (optional - for performance optimization)
  redis:
    image: redis:7-alpine
    container_name: lightstack-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lightstack-network
    restart: unless-stopped

  # Lightstack OpenStack-Compatible Cloud
  lightstack:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    container_name: lightstack
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "35357:35357" # Keystone (Identity)
      - "8774:8774" # Nova (Compute)
      - "9696:9696" # Neutron (Network)
      - "8776:8776" # Cinder (Block Storage)
      - "9292:9292" # Glance (Image)
      - "8775:8775" # Metadata Service
    environment:
      LIGHTSTACK_DB_URL: "postgres://${POSTGRES_USER:-lightstack}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-lightstack}?sslmode=disable"
      LIGHTSTACK_REDIS_URL: "redis://redis:6379/0"
      LIGHTSTACK_CACHE_ENABLED: "true"
      LIGHTSTACK_JWT_SECRET: "${LIGHTSTACK_JWT_SECRET:-change-me-in-production}"
      # The binary refuses the well-known default secret above unless this is
      # set (review S2). This is the stub-mode development stack — no real
      # guests, tokens never leave the host — so the escape hatch is
      # acceptable here. NEVER set it where real guests or foreign clients
      # reach the services: pass a real LIGHTSTACK_JWT_SECRET instead.
      # Defaults ON for dev but is overridable: when you pass a real
      # LIGHTSTACK_JWT_SECRET, set this to false/0 to re-arm the guard.
      LIGHTSTACK_ALLOW_INSECURE_DEFAULT_SECRET: "${LIGHTSTACK_ALLOW_INSECURE_DEFAULT_SECRET:-true}"
      LIGHTSTACK_ENDPOINT_HOST: "localhost" # Use localhost for service catalog URLs (accessible from host)
      # Why this exists: tests run outside any guest, so they name the instance they ask
      # the metadata service about with the X-Instance-ID header (test/contract/ws4_*,
      # test/metadata_test.sh). By default that header is believed only from loopback,
      # and port mapping presents host-run requests from the Docker bridge gateway
      # instead. This stack runs in stub mode, with no real guests to protect. Never set
      # it where real guests reach the metadata service: any of them could then read any
      # instance's metadata and user-data.
      LIGHTSTACK_METADATA_TRUST_INSTANCE_HEADER: "true"
    networks:
      - lightstack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:35357/v3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Horizon Dashboard (OpenStack Web UI)
  # DISABLED: Kolla Horizon image requires complex Apache/Kolla-Ansible setup
  #
  # Issues with simple docker-compose deployment:
  #   - Apache fails with "no listening sockets available"
  #   - Log directory permission issues
  #   - Missing Apache port configuration
  #   - Requires Kolla-Ansible orchestration for proper setup
  #
  # Alternative: Use OpenStack CLI for API testing:
  #   openstack server list
  #   openstack network list
  #
  # For production Horizon: Deploy with Kolla-Ansible on proper infrastructure
  #
  # horizon:
  #   image: quay.io/openstack.kolla/horizon:2025.2-ubuntu-noble
  #   container_name: lightstack-horizon
  #   depends_on:
  #     lightstack:
  #       condition: service_healthy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     KOLLA_SERVICE_NAME: horizon
  #     KOLLA_CONFIG_STRATEGY: COPY_ALWAYS
  #     OPENSTACK_HOST: lightstack
  #   volumes:
  #     - ./deployments/horizon/kolla_config/config.json:/var/lib/kolla/config_files/config.json:ro
  #     - ./deployments/horizon/horizon_settings.py:/var/lib/kolla/config_files/horizon_settings.py:ro
  #     - horizon_logs:/var/log/apache2
  #     - horizon_kolla_logs:/var/log/kolla/horizon
  #   networks:
  #     - lightstack-network
  #   restart: unless-stopped
  #   platform: linux/amd64

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  horizon_static:
    driver: local
  horizon_logs:
    driver: local
  horizon_kolla_logs:
    driver: local

networks:
  lightstack-network:
    driver: bridge
