# SPEC-014 T003: real Ceph RGW (S3 + Swift) integration fixture.
# postgres + ceph/demo (all-in-one real RGW) + Lightstack with Glance in S3 mode.
# Self-contained and isolated (own project name, network, and alternate host
# ports) so it never collides with another Lightstack deployment on the host.
#
#   podman compose -f deployments/docker-compose.rgw-test.yml up -d --build
#   ./test/rgw_integration_test.sh          # capability A: Glance images
#   ./test/tenant_s3_rgw_test.sh            # capability B: tenant S3 keys
#   ./test/swift_rgw_test.sh                # capability C: Swift via keystone tokens
#   podman compose -f deployments/docker-compose.rgw-test.yml down -v
#
# Podman-compatible (docker compose works too). Use: -p lightstack-rgwtest
version: "3.8"

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: lightstack
      POSTGRES_USER: lightstack
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightstack"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [rgwtest]

  # All-in-one Ceph + RGW. Creates the demo user with the fixed keys below and
  # the `images` bucket (capability A: Glance image storage), then the wrapper
  # entrypoint wires the RGW's keystone auth to Lightstack: tenant S3 keys minted by
  # Lightstack validate via /v3/s3tokens (capability B) and Swift X-Auth-Token
  # requests validate via /v3/auth/tokens (capability C). Serves S3 + Swift on :8080.
  rgw:
    image: quay.io/ceph/demo:latest-squid
    entrypoint: ["bash", "/rgw-keystone-entrypoint.sh"]
    environment:
      MON_IP: 127.0.0.1
      CEPH_PUBLIC_NETWORK: 0.0.0.0/0
      NETWORK_AUTO_DETECT: "4"
      RGW_NAME: rgw
      CEPH_DEMO_UID: lightstack
      CEPH_DEMO_ACCESS_KEY: lightstacktestaccess
      CEPH_DEMO_SECRET_KEY: lightstacktestsecret
      CEPH_DEMO_BUCKET: images
      # Capability-B wireup target (RGW → Lightstack Keystone S3 auth). Lightstack is reachable
      # by service name on the shared network.
      LIGHTSTACK_KEYSTONE_URL: "http://lightstack:35357"
    volumes:
      - ./rgw-keystone-entrypoint.sh:/rgw-keystone-entrypoint.sh:ro
    ports:
      - "48080:8080" # RGW S3 (host access for the test driver)
    networks: [rgwtest]

  lightstack:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rgw:
        condition: service_started
    environment:
      LIGHTSTACK_DB_URL: "postgres://lightstack:secret@postgres:5432/lightstack?sslmode=disable"
      LIGHTSTACK_JWT_SECRET: "rgwtest-secret"
      # Glance -> Ceph RGW (S3). Credentials are env-only; match the demo user above.
      LIGHTSTACK_GLANCE_STORAGE_MODE: "s3"
      LIGHTSTACK_GLANCE_S3_ENDPOINT: "http://rgw:8080"
      LIGHTSTACK_GLANCE_S3_BUCKET: "images"
      LIGHTSTACK_GLANCE_S3_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "lightstacktestaccess"
      AWS_SECRET_ACCESS_KEY: "lightstacktestsecret"
      LIGHTSTACK_ENDPOINT_HOST: "localhost"
      # The transform under test (capability C): token payloads advertise
      # project ids in OpenStack's dash-free form so RGW derives one valid
      # tenant per project.
      LIGHTSTACK_KEYSTONE_RGW_COMPAT_TENANT_IDS: "true"
    ports:
      - "45357:35357" # Keystone
      - "49292:9292" # Glance
    networks: [rgwtest]

networks:
  rgwtest:
