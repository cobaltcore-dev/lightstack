{{/*
  Carries the reused deployments/horizon-config/* files (copied verbatim into files/, except a
  two-line env-driven host repoint in local_settings). Mounted at /var/lib/kolla/config_files/;
  kolla's COPY_ALWAYS entrypoint reads config.json here and copies each source to its dest.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lightstack-horizon.fullname" . }}-config
  labels:
    {{- include "lightstack-horizon.labels" . | nindent 4 }}
data:
  config.json: |
{{ .Files.Get "files/config.json" | indent 4 }}
  local_settings: |
{{ .Files.Get "files/local_settings" | indent 4 }}
  ports.conf: |
{{ .Files.Get "files/ports.conf" | indent 4 }}
  horizon-nolist.conf: |
{{ .Files.Get "files/horizon-nolist.conf" | indent 4 }}
