apiVersion: v2
name: o3k-horizon
description: >-
  Horizon dashboard (kolla Flamingo 2025.2) for O3K. Deploys the UNMODIFIED upstream
  Horizon image plus memcached against an O3K deployment, reusing deployments/horizon-config/*.
  The noVNC console is deliberately NOT part of this chart: it is a property of the
  O3K node (node-local token directory, host network namespace), so it ships in
  charts/o3k as consoleProxy and Horizon stays deployable anywhere.
type: application
# Chart version (SemVer), bumped independently of the dashboard release.
# 0.2.0: promoted out of deployments/ into a product chart; the reproduction-only
#        noVNC deployment removed in favour of charts/o3k's console proxy (SPEC-021).
version: 0.2.0
appVersion: "2025.2"
kubeVersion: ">=1.25.0-0"
keywords:
  - horizon
  - openstack
  - o3k
  - dashboard
home: https://github.com/cobaltcore-dev/o3k
