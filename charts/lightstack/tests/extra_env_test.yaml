# helm-unittest specs for the extraEnv passthrough (SPEC-014): the Lightstack container must
# carry arbitrary env vars — the Glance s3 backend reads its RGW credentials
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) from the environment, not from lightstack.yaml.
suite: extraEnv passthrough
templates:
  - templates/deployment.yaml
set:
  image.repository: ghcr.io/lightstack/lightstack
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
tests:
  - it: injects plain extraEnv entries into the container env
    set:
      extraEnv:
        - name: AWS_ACCESS_KEY_ID
          value: AKIAX
        - name: AWS_SECRET_ACCESS_KEY
          value: SEKRET
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: AKIAX
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_SECRET_ACCESS_KEY
            value: SEKRET
  - it: supports Secret-backed extraEnv (valueFrom.secretKeyRef)
    set:
      extraEnv:
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rgw-s3-creds
              key: secretKey
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: rgw-s3-creds
                key: secretKey
  - it: renders only the node name and the backend marker when extraEnv is empty
    set:
      database.url: postgres://lightstack@db/lightstack
    asserts:
      # LIGHTSTACK_NODE_NAME + LIGHTSTACK_DB_BACKEND (always set, SPEC-029 FR-003).
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 2
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: LIGHTSTACK_NODE_NAME
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_DB_BACKEND
            value: postgres
