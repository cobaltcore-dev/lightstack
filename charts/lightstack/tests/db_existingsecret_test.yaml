# helm-unittest specs for DB-URL-from-existing-Secret + ServiceAccount hardening
# (PR #54 review C4). database.existingSecret must inject LIGHTSTACK_DB_URL via secretKeyRef,
# and the pod must never mount a ServiceAccount token (Lightstack never calls the k8s API).
suite: database existingSecret + automount
templates:
  - templates/deployment.yaml
set:
  image.repository: ghcr.io/lightstack/lightstack
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
tests:
  - it: injects LIGHTSTACK_DB_URL from database.existingSecret (default key 'url')
    set:
      database.existingSecret: my-db-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_DB_URL
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: url
  - it: honors a custom database.existingSecretKey
    set:
      database.existingSecret: my-db-secret
      database.existingSecretKey: dburl
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_DB_URL
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: dburl
  - it: never mounts a ServiceAccount token
    set:
      database.url: postgres://lightstack@db/lightstack
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  # SPEC-029 FR-003/FR-017: a URL kept in a Secret is invisible to the chart, so the
  # backend resolves to postgres and the binary verifies it. No SQLite storage is rendered.
  - it: marks the backend postgres and adds no SQLite storage when the URL is in a Secret
    set:
      database.existingSecret: my-db-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_DB_BACKEND
            value: postgres
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: sqlite-db
            hostPath:
              path: /var/lib/lightstack/db
              type: DirectoryOrCreate
      - notExists:
          path: spec.strategy
