# helm-unittest specs for the rendered lightstack.yaml config Secret (PR #54 review C1, FR-006).
# Pins the removed `| default "…REPLACE_ME…"` on database.url: the config must carry the
# supplied URL, or an empty string when the URL comes from a Secret — never a placeholder.
suite: config secret render
templates:
  - templates/secret.yaml
set:
  image.repository: ghcr.io/lightstack/lightstack
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
tests:
  - it: carries the supplied database.url verbatim, no placeholder
    set:
      database.url: postgres://lightstack@db/lightstack
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: 'url: "postgres://lightstack@db/lightstack"'
      - notMatchRegex:
          path: stringData["lightstack.yaml"]
          pattern: REPLACE_ME
  - it: renders an empty url (never REPLACE_ME) when the URL comes from database.existingSecret
    set:
      database.existingSecret: db-sec
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: 'url: ""'
      - notMatchRegex:
          path: stringData["lightstack.yaml"]
          pattern: REPLACE_ME
  - it: renders the RGW compatibility flag disabled by default
    set:
      database.url: postgres://lightstack@db/lightstack
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: 'rgw_compat_tenant_ids: false'
  - it: renders the RGW compatibility flag when explicitly enabled
    set:
      database.url: postgres://lightstack@db/lightstack
      keystone.rgwCompatTenantIds: true
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: 'rgw_compat_tenant_ids: true'
  - it: renders the default hostStoragePath as the binary's state_path
    set:
      database.url: postgres://lightstack@db/lightstack
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: '(?m)^state_path: "/var/lib/lightstack"$'
  - it: renders a custom hostStoragePath as the binary's state_path
    # The chart mounts hostStoragePath at the same path inside the pod, and the binary
    # must use that same string as its root: libvirtd on the host opens the paths
    # Lightstack writes into the domain XML.
    set:
      database.url: postgres://lightstack@db/lightstack
      realMode.hostStoragePath: /data/lightstack
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: '(?m)^state_path: "/data/lightstack"$'
  - it: tells the binary a console proxy exists in single-node real mode
    set:
      database.url: postgres://lightstack@db/lightstack
      realMode.enabled: true
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: '(?m)^  console_enabled: true$'
  - it: tells the binary no console proxy exists in multi-node, so it refuses consoles
    # Without this the API would keep issuing URLs to a proxy that is not there.
    set:
      database.url: postgres://lightstack@db/lightstack
      realMode.enabled: true
      deploymentMode: multi-node
      glance.storageMode: rbd
      cinder.storageMode: rbd
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: '(?m)^  console_enabled: false$'
  - it: tells the binary no console proxy exists when consoleProxy is disabled
    set:
      database.url: postgres://lightstack@db/lightstack
      realMode.enabled: true
      consoleProxy.enabled: false
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: '(?m)^  console_enabled: false$'
  # SPEC-031 FR-004: a non-default libvirt socket is the one the binary dials, not only the one
  # the pod mounts. The default leaves the choice to the binary — virtqemud-sock, else
  # libvirt-sock — so the default render does not change.
  - it: hands a non-default libvirt socket to the binary as libvirt_uri
    set:
      database.url: postgres://lightstack@db/lightstack
      realMode.enabled: true
      realMode.libvirtSocketPath: /run/libvirt/virtqemud-sock
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: '(?m)^  libvirt_uri: "/run/libvirt/virtqemud-sock"$'
  - it: leaves the socket choice to the binary by default
    set:
      database.url: postgres://lightstack@db/lightstack
      realMode.enabled: true
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: '(?m)^  libvirt_uri: "qemu:///system"$'
  - it: leaves the socket choice to the binary when the default socket is set explicitly
    set:
      database.url: postgres://lightstack@db/lightstack
      realMode.enabled: true
      realMode.libvirtSocketPath: /var/run/libvirt/libvirt-sock
    asserts:
      - matchRegex:
          path: stringData["lightstack.yaml"]
          pattern: '(?m)^  libvirt_uri: "qemu:///system"$'
