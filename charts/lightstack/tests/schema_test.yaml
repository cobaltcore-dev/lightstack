# helm-unittest specs for values.schema.json structural rejection (US1 / FR-003, FR-004, FR-006).
# Schema validation runs during render; a structurally invalid value set must fail the template.
# NOTE: if a Helm/helm-unittest version does not surface schema-validation errors through
# failedTemplate, this suite is removed and the bash gate in ci/run-tests.sh is authoritative (R5).
suite: values.schema.json structural rejection
templates:
  - templates/service.yaml
tests:
  - it: rejects an unknown/misspelled top-level key (additionalProperties)
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: x
      secrets.adminPassword: x
      database.url: postgres://lightstack@db/lightstack
      databse.url: postgres://lightstack@db/lightstack
    asserts:
      - failedTemplate:
          errorPattern: "Additional property|schema"
  - it: rejects a storageMode outside the allowed set (enum)
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: x
      secrets.adminPassword: x
      database.url: postgres://lightstack@db/lightstack
      glance.storageMode: nfs
    asserts:
      - failedTemplate:
          errorPattern: "storageMode|must be one of|schema"
  - it: rejects replicaCount below the minimum (range)
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: x
      secrets.adminPassword: x
      database.url: postgres://lightstack@db/lightstack
      replicaCount: 0
    asserts:
      - failedTemplate:
          errorPattern: "replicaCount|greater than or equal|schema"
  - it: rejects a non-boolean RGW compatibility flag
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: x
      secrets.adminPassword: x
      database.url: postgres://lightstack@db/lightstack
      keystone.rgwCompatTenantIds: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "rgwCompatTenantIds|boolean|schema"
  - it: rejects a consoleProxyBaseUrl carrying a path (pattern)
    # An origin only (SPEC-021 FR-020): Lightstack appends the client page itself, so a
    # path yields a console link that 404s. The binary refuses it at startup too; the
    # pattern moves that failure from a crash-looping pod to `helm install`.
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: x
      secrets.adminPassword: x
      database.url: postgres://lightstack@db/lightstack
      nova.consoleProxyBaseUrl: http://10.2.199.101:6080/vnc_auto.html
    asserts:
      - failedTemplate:
          errorPattern: "consoleProxyBaseUrl|does not match pattern|schema"
  - it: rejects a relative hostStoragePath (pattern)
    # The chart hands it to the binary as state_path, which must be absolute: libvirtd
    # on the host opens the paths Lightstack writes into the domain XML. The binary
    # refuses a relative root at startup too; the pattern moves that failure from a
    # crash-looping pod to `helm install`.
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: x
      secrets.adminPassword: x
      database.url: postgres://lightstack@db/lightstack
      realMode.hostStoragePath: data/lightstack
    asserts:
      - failedTemplate:
          errorPattern: "hostStoragePath|does not match pattern|schema"
  - it: rejects a console proxy image digest that is not a sha256 digest (pattern)
    # The template renders repository@digest, so a tag here yields a reference the
    # runtime cannot pull.
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: x
      secrets.adminPassword: x
      database.url: postgres://lightstack@db/lightstack
      consoleProxy.image.digest: "1.3.0"
    asserts:
      - failedTemplate:
          errorPattern: "/consoleProxy/image/digest.*does not match pattern"
  - it: rejects consoleProxy.libvirtDomainDir, removed when the console sockets moved (additionalProperties)
    # The proxy no longer mounts libvirt's per-domain directories (SPEC-021 FR-023c), so
    # a value still naming one is a leftover the operator should drop, not ignore.
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: x
      secrets.adminPassword: x
      database.url: postgres://lightstack@db/lightstack
      consoleProxy.libvirtDomainDir: /var/lib/libvirt/qemu
    asserts:
      - failedTemplate:
          errorPattern: "libvirtDomainDir"
