# helm-unittest: SPEC-010 teardown hooks (T007). Render-gating + RBAC least-privilege
# + the purge Job's blocking/bounded spec. Defaults (retain) must render nothing.
suite: teardown hooks
release:
  name: rel
set:
  image.repository: ghcr.io/lightstack/lightstack
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
  database.url: postgres://lightstack@db/lightstack
tests:
  - it: retain (default) renders NO teardown resources (SC-004 — no regression)
    set:
      dataRetentionPolicy: retain
    asserts:
      - hasDocuments: { count: 0 }
        template: templates/teardown-rbac.yaml
      - hasDocuments: { count: 0 }
        template: templates/teardown-quiesce-job.yaml
      - hasDocuments: { count: 0 }
        template: templates/teardown-purge-job.yaml

  - it: delete renders RBAC (SA+Role+RoleBinding) as pre-delete hooks at weight -20
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: rancher/kubectl:v1.31
    template: templates/teardown-rbac.yaml
    asserts:
      - hasDocuments: { count: 3 }
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-20"

  - it: RBAC Role grants exactly the least-privilege verb set (R7/FR-011)
    documentIndex: 1
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: rancher/kubectl:v1.31
    template: templates/teardown-rbac.yaml
    asserts:
      - equal:
          path: rules[0].resources
          value: ["deployments"]
      - equal:
          path: rules[0].verbs
          value: ["get", "list", "patch"]
      - equal:
          path: rules[1].resources
          value: ["deployments/scale"]
      - equal:
          path: rules[1].verbs
          value: ["get", "patch", "update"]
      - equal:
          path: rules[2].resources
          value: ["pods"]
      - equal:
          path: rules[2].verbs
          value: ["get", "list"]
      - equal:
          path: rules[3].resources
          value: ["persistentvolumeclaims"]
      - equal:
          path: rules[3].verbs
          value: ["get", "list", "delete"]

  - it: quiesce Job is a pre-delete hook at weight -10
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: rancher/kubectl:v1.31
    template: templates/teardown-quiesce-job.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"

  - it: purge Job runs `lightstack cleanup`, blocking (weight 0), bounded, non-retrying
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: rancher/kubectl:v1.31
      teardown.timeoutSeconds: 600
    template: templates/teardown-purge-job.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/app/lightstack", "cleanup", "--config", "/app/config/lightstack.yaml"]
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600
      - equal:
          path: spec.backoffLimit
          value: 0

  # `lightstack cleanup` reads the database to enumerate what to purge and refuses an empty
  # URL (SPEC-028 FR-001). With the URL in database.existingSecret the rendered config holds
  # none, so the purge Job needs the same LIGHTSTACK_DB_URL the workload gets — without it
  # the job exits 2 and the blocking hook halts the uninstall.
  - it: purge Job reads the database URL from database.existingSecret, as the workload does
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: rancher/kubectl:v1.31
      database.url: ""
      database.existingSecret: my-db-secret
    template: templates/teardown-purge-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_DB_URL
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: url

  - it: purge Job honors a custom database.existingSecretKey
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: rancher/kubectl:v1.31
      database.url: ""
      database.existingSecret: my-db-secret
      database.existingSecretKey: dburl
    template: templates/teardown-purge-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_DB_URL
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: dburl

  - it: purge Job carries the backend marker but no DB_URL when the URL is in the rendered config
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: rancher/kubectl:v1.31
    template: templates/teardown-purge-job.yaml
    asserts:
      # LIGHTSTACK_DB_BACKEND is always set so a Secret-hidden scheme mismatch is caught
      # (SPEC-029 FR-003); LIGHTSTACK_DB_URL is absent when the config carries the URL.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_DB_BACKEND
            value: postgres
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_DB_URL

  # SPEC-029 FR-010: the purge Job is scheduled exactly like the workload, so a SQLite
  # purge reaches the database on the node. The nodeSelector/affinity/tolerations come
  # from the shared lightstack.scheduling helper, included by both.
  - it: purge Job is pinned like the Deployment (scheduling parity)
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: rancher/kubectl:v1.31
      nodeSelector:
        kubernetes.io/hostname: node-a
      tolerations:
        - key: dedicated
          operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: disktype, operator: Exists }
    template: templates/teardown-purge-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/hostname: node-a
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: dedicated
              operator: Exists
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: disktype

  - it: the Deployment carries the identical scheduling (parity oracle)
    set:
      nodeSelector:
        kubernetes.io/hostname: node-a
      tolerations:
        - key: dedicated
          operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: disktype, operator: Exists }
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/hostname: node-a
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: dedicated
              operator: Exists
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: disktype

  # SPEC-029: the purge Job keeps the node pin but NOT the workload's pod affinity. The quiesce
  # hook scales the workload to zero first, so a required self-podAffinity would leave the purge
  # unschedulable and hang the uninstall. Covers PostgreSQL (suite base) and SQLite below.
  - it: purge Job keeps nodeAffinity but drops the workload's podAffinity (PostgreSQL)
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: alpine/k8s:1.31.0
      nodeSelector:
        kubernetes.io/hostname: node-a
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: disktype, operator: Exists }
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app.kubernetes.io/name: lightstack }
              topologyKey: kubernetes.io/hostname
    template: templates/teardown-purge-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: disktype
      - notExists:
          path: spec.template.spec.affinity.podAffinity

  - it: the workload DOES keep podAffinity (the drop is purge-only)
    set:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app.kubernetes.io/name: lightstack }
              topologyKey: kubernetes.io/hostname
    template: templates/deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.affinity.podAffinity

  - it: SQLite purge Job also drops the workload's podAffinity
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: alpine/k8s:1.31.0
      database.url: sqlite:///var/lib/lightstack/db/lightstack.db
      nodeSelector:
        kubernetes.io/hostname: node-a
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app.kubernetes.io/name: lightstack }
              topologyKey: kubernetes.io/hostname
    template: templates/teardown-purge-job.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity.podAffinity

  # SPEC-029 FR-011: a stub-mode SQLite purge mounts the node-local STATE ROOT (not the db
  # directory), so `lightstack cleanup` can RemoveAll db/ — a direct db-dir mount would make
  # db/ an un-unlinkable mountpoint and fail the purge.
  - it: stub-mode SQLite purge Job mounts the state root and carries the sqlite backend
    set:
      dataRetentionPolicy: delete
      teardown.kubectlImage: alpine/k8s:1.31.0
      database.url: sqlite:///var/lib/lightstack/db/lightstack.db
      nodeSelector:
        kubernetes.io/hostname: node-a
    template: templates/teardown-purge-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-storage
            hostPath:
              path: /var/lib/lightstack
              type: DirectoryOrCreate
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-storage
            mountPath: /var/lib/lightstack
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: sqlite-db
            hostPath:
              path: /var/lib/lightstack/db
              type: DirectoryOrCreate
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_DB_BACKEND
            value: sqlite

  - it: delete without teardown.kubectlImage fails to render (FR-018)
    set:
      dataRetentionPolicy: delete
    template: templates/teardown-quiesce-job.yaml
    asserts:
      - failedTemplate:
          errorMessage: "teardown.kubectlImage is required when dataRetentionPolicy=delete (no implicit image pull; FR-018 / issue #53)."
