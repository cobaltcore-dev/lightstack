# helm-unittest specs for the optional-TLS path (T010, FR-008b).
suite: tls / catalog scheme
templates:
  - templates/deployment.yaml
set:
  image.repository: ghcr.io/lightstack/lightstack
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
  database.url: postgres://lightstack@db/lightstack
tests:
  - it: sets LIGHTSTACK_ENDPOINT_SCHEME=https when tls.enabled
    set:
      tls.enabled: true
      tls.secretName: lightstack-cert
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_ENDPOINT_SCHEME
            value: "https"
  - it: sets no catalog scheme by default (the env block holds the node name and the backend marker)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_ENDPOINT_SCHEME
            value: "https"
      # LIGHTSTACK_NODE_NAME + LIGHTSTACK_DB_BACKEND (always set, SPEC-029 FR-003).
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 2
  - it: does not set the https scheme when only the endpoint host is configured
    set:
      endpointHost: lightstack.example.com
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_ENDPOINT_SCHEME
            value: "https"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIGHTSTACK_ENDPOINT_HOST
            value: "lightstack.example.com"
