# helm-unittest specs for the single-node stub render (T009, contracts C2).
suite: single-node stub render
templates:
  - templates/deployment.yaml
set:
  image.repository: ghcr.io/lightstack/lightstack
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
  database.url: postgres://lightstack@db/lightstack
tests:
  - it: renders a single-node Deployment
    asserts:
      - isKind:
          of: Deployment
  - it: is unprivileged in stub mode (restricted-PSA-clean)
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext
      - notExists:
          path: spec.template.spec.hostNetwork
  - it: execs the binary directly (image has CMD but no ENTRYPOINT)
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/app/lightstack", "--config", "/app/config/lightstack.yaml"]
  - it: mounts the config Secret at the --config path
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /app/config
            readOnly: true
  - it: stub replicas are configurable
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
