# helm-unittest specs for the install-time fail-fast gates (T005).
# Run with: helm plugin install https://github.com/helm-unittest/helm-unittest && helm unittest charts/lightstack
suite: install-time fail-fast gates
templates:
  - templates/service.yaml
tests:
  - it: fails when jwtSecret is missing (FR-007)
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.adminPassword: pw
      database.url: postgres://lightstack@db/lightstack
    asserts:
      - failedTemplate:
          errorPattern: "jwtSecret is required"
  - it: fails when adminPassword is missing (FR-007a)
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: jwt
      database.url: postgres://lightstack@db/lightstack
    asserts:
      - failedTemplate:
          errorPattern: "adminPassword is required"
  - it: fails when database.url is missing (FR-006)
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: jwt
      secrets.adminPassword: pw
    asserts:
      - failedTemplate:
          errorPattern: "database.url is required"
  - it: multi-node real rejects local glance/cinder backends (FR-012e)
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: jwt
      secrets.adminPassword: pw
      database.url: postgres://lightstack@db/lightstack
      deploymentMode: multi-node
      realMode.enabled: true
      glance.storageMode: local
      cinder.storageMode: local
    asserts:
      - failedTemplate:
          errorPattern: "FR-012e"
  - it: cache.enabled requires redisUrl (FR-006a)
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: jwt
      secrets.adminPassword: pw
      database.url: postgres://lightstack@db/lightstack
      cache.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "cache.enabled requires cache.redisUrl"
  - it: rejects drainSeconds >= terminationGracePeriodSeconds (SPEC-013 FR-009)
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: jwt
      secrets.adminPassword: pw
      database.url: postgres://lightstack@db/lightstack
      drainSeconds: 45
      terminationGracePeriodSeconds: 30
    asserts:
      - failedTemplate:
          errorPattern: "must be less than terminationGracePeriodSeconds"
  - it: renders with minimal valid values
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: jwt
      secrets.adminPassword: pw
      database.url: postgres://lightstack@db/lightstack
    asserts:
      - hasDocuments:
          count: 1
  - it: fails when tls.enabled deploys the console proxy without an explicit origin
    # The proxy serves plain HTTP, so an https console needs something in front of it
    # to terminate TLS. An http one inside an https deployment is mixed content, which
    # browsers block, so neither derived origin would work.
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: jwt
      secrets.adminPassword: pw
      database.url: postgres://lightstack@db/lightstack
      realMode.enabled: true
      tls.enabled: true
      tls.secretName: lightstack-tls
    asserts:
      - failedTemplate:
          errorPattern: "nova.consoleProxyBaseUrl"
  - it: fails when the console proxy port is changed without an explicit origin
    # Without an origin, Lightstack derives one at the default port (6080, the binary's
    # defaultConsoleProxyPort); a proxy listening elsewhere would get links to a port
    # where nothing answers.
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: jwt
      secrets.adminPassword: pw
      database.url: postgres://lightstack@db/lightstack
      realMode.enabled: true
      consoleProxy.service.port: 7080
    asserts:
      - failedTemplate:
          errorPattern: "consoleProxy.service.port"
  - it: renders a changed console proxy port once the origin is explicit
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: jwt
      secrets.adminPassword: pw
      database.url: postgres://lightstack@db/lightstack
      realMode.enabled: true
      consoleProxy.service.port: 7080
      nova.consoleProxyBaseUrl: http://10.2.199.101:7080
    asserts:
      - hasDocuments:
          count: 1
  - it: renders tls.enabled with the console proxy once the origin is explicit
    set:
      image.repository: ghcr.io/lightstack/lightstack
      secrets.jwtSecret: jwt
      secrets.adminPassword: pw
      database.url: postgres://lightstack@db/lightstack
      realMode.enabled: true
      tls.enabled: true
      tls.secretName: lightstack-tls
      nova.consoleProxyBaseUrl: https://console.example.com
    asserts:
      - hasDocuments:
          count: 1
