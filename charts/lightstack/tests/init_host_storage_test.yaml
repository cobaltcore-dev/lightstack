# helm-unittest specs for the real-mode node-local storage initContainer
# (SPEC-011 / cloud-storage#510). The chart's host-storage hostPath is
# DirectoryOrCreate, which materializes only /var/lib/lightstack and shadows the image's
# pre-created subdirs. This initContainer pre-creates the per-service subdirs on
# that mount before Lightstack starts, so a fresh real-mode deploy boots a VM with no
# manual mkdir. Gated on realMode.enabled (FR-001/009; contracts C-CHART-1/2/3).
suite: real-mode host-storage initContainer
set:
  image.repository: ghcr.io/lightstack/lightstack
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
  database.url: postgres://lightstack@db/lightstack
tests:
  - it: single-node real mode pre-creates the node-local subdirs before lightstack starts
    template: templates/deployment.yaml
    set:
      realMode.enabled: true
    asserts:
      - exists:
          path: spec.template.spec.initContainers[0]
      - matchRegex:
          path: spec.template.spec.initContainers[0].image
          pattern: ghcr.io/lightstack/lightstack
      - equal:
          path: spec.template.spec.initContainers[0].command[0]
          value: /bin/sh
      - equal:
          path: spec.template.spec.initContainers[0].command[1]
          value: -c
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: mkdir -p
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: /var/lib/lightstack/images
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: /var/lib/lightstack/volumes
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: /var/lib/lightstack/instances
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: /var/lib/lightstack/cloud-init
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: /var/lib/lightstack/dhcp
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-storage
            mountPath: /var/lib/lightstack
  - it: multi-node real mode also pre-creates the subdirs (shared podSpec covers the DaemonSet)
    template: templates/daemonset.yaml
    set:
      deploymentMode: multi-node
      realMode.enabled: true
      glance.storageMode: rbd   # multi-node gates (FR-012e): image + volume storage must be
      cinder.storageMode: rbd   # cluster-shared; the node-local subdirs are still created
    asserts:
      - exists:
          path: spec.template.spec.initContainers[0]
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: /var/lib/lightstack/dhcp
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-storage
            mountPath: /var/lib/lightstack
  - it: honors a custom hostStoragePath
    template: templates/deployment.yaml
    set:
      realMode.enabled: true
      realMode.hostStoragePath: /data/lightstack
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: /data/lightstack/images
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-storage
            mountPath: /data/lightstack
  - it: stub mode renders no initContainer (FR-009 — non-real deploys unaffected)
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
