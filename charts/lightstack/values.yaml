# Default values for the Lightstack chart.
# Defaults target the validated MVP: single-node, stub mode, no TLS.
# Every value is documented in docs/specs/008-helm-charts/data-model.md (FR-017).

# -- REQUIRED. Container image. The chart pulls no implicit image (FR-018):
#    installation fails fast if image.repository is empty.
image:
  repository: ""              # e.g. ghcr.io/your-org/lightstack  (REQUIRED)
  tag: ""                     # defaults to Chart.appVersion when empty
  pullPolicy: IfNotPresent
  pullSecrets: []

# -- Override the chart name used in resource names (default: the chart name).
nameOverride: ""

# -- Deployment mode: "single-node" (Deployment) or "multi-node" (DaemonSet). FR-002.
deploymentMode: single-node

# -- Single-node stub replicas (all state in the DB). Real mode forces 1. FR-003b.
replicaCount: 1

# -- External database (REQUIRED — the chart deploys no DB). FR-006.
database:
  url: ""                     # postgres://user:pass@host:5432/lightstack?sslmode=disable
  existingSecret: ""          # name of a Secret holding the DB URL (alternative to database.url);
                              # injected as the LIGHTSTACK_DB_URL env var, which overrides the config file
  existingSecretKey: url      # key within database.existingSecret that holds the URL

# -- Sensitive values. Required unless secrets.existingSecret is supplied. FR-007/007a/007b.
secrets:
  jwtSecret: ""               # REQUIRED — token signing secret (no insecure default)
  adminUser: admin
  adminPassword: ""           # REQUIRED — no deployment runs with admin/secret
  existingSecret: ""          # operator-pre-rendered Secret with a "lightstack.yaml" key (GitOps)

# -- Advertised endpoint host for the service catalog (FR-008a). Empty = in-cluster only.
endpointHost: ""

# -- Keystone compatibility options.
keystone:
  # -- Render project IDs in OpenStack's dash-free RGW-safe form in token responses.
  rgwCompatTenantIds: false

# -- Front-door Service (the six API services; metadata is node-local, FR-009d).
service:
  type: ClusterIP             # ClusterIP | NodePort | LoadBalancer
  annotations: {}

# -- Optional Ingress (external exposure).
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []

# -- Optional TLS at the exposure layer (FR-008b). Sets the catalog scheme to https.
tls:
  enabled: false
  secretName: ""              # operator-supplied cert Secret (default: <release>-lightstack-tls)
  certManagerIssuer: ""       # OR a cert-manager (Cluster)Issuer name to auto-provision the cert
  certManagerKind: ClusterIssuer   # which cert-manager annotation to emit: ClusterIssuer | Issuer

# -- Per-service modes (FR-011/012). All set in the rendered lightstack.yaml.
nova:
  libvirtMode: stub           # stub | real
neutron:
  networkingMode: stub        # stub | iptables | ebpf
  securityGroupMode: stub     # stub | iptables | ebpf
cinder:
  storageMode: stub           # stub | local | rbd | local,rbd
glance:
  storageMode: stub           # stub | local | rbd | s3 | local,rbd | local,s3  (rbd,s3 unsupported: no Glance RBD backend)
  # -- S3 / Ceph RGW backend (used when storageMode includes "s3"). Credentials come
  #    from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in the environment — set them via
  #    `extraEnv` below, not here.
  s3:
    endpoint: ""              # RGW S3 endpoint, e.g. https://rgw.example:443
    bucket: ""                # pre-created bucket for image data (lightstack does not create it)
    region: us-east-1
    caBundle: ""              # in-container path to a PEM CA bundle for an internal-CA HTTPS RGW
    insecureSkipVerify: false # test-only; never true in production

# -- Extra environment variables for the Lightstack container (standard k8s env entries).
#    Primary use: S3/RGW credentials for the Glance s3 backend, which the AWS SDK reads
#    from the environment. Prefer a Secret (valueFrom.secretKeyRef) for real credentials.
extraEnv: []
#  - name: AWS_ACCESS_KEY_ID
#    value: "AKIA..."
#  - name: AWS_SECRET_ACCESS_KEY
#    valueFrom:
#      secretKeyRef: { name: rgw-s3-creds, key: secretKey }

# -- Real mode (privileged libvirt + host access). Off by default (FR-012). Authored;
#    real-mode VM e2e is gated on the post-conditions (issue #52).
realMode:
  enabled: false
  privileged: false
  hostNetwork: false
  libvirtSocketPath: /var/run/libvirt/libvirt-sock
  hostStoragePath: /var/lib/lightstack
  # -- One-time in-place upgrade from a pre-rename install (cloud-storage#575).
  #    Set to that node's old state root (the product was renamed, the root moved with
  #    it) and an initContainer moves its contents into hostStoragePath once, before
  #    the subdirs are pre-created. Empty renders nothing — fresh installs need it not.
  legacyStatePath: ""
  floatingIpPool: ""          # operator-supplied pool routed to nodes (FR-009c)

podSecurity:
  applyPrivilegedNamespaceLabel: false   # real mode only (FR-012d)

# -- Multi-node (DaemonSet) — authored; cross-node behavior gated on issue #52.
multiNode:
  nodeSelectorLabel: "lightstack.io/compute=true"
  vxlanEnabled: true
  vxlanPort: 4789
  minProductVersion: ""       # FR-010 — set when the placement post-condition (WS-1) ships

# -- Optional cache (off by default; opt-in Redis). FR-006a.
#    In multi-node, redisUrl MUST point at a single shared Redis (cross-node invalidation).
cache:
  enabled: false
  redisUrl: ""

# -- Uninstall behavior (FR-002/013/014; issue #53).
#    retain (default): `helm uninstall` removes only the release's Kubernetes
#    workloads, leaving ALL persisted/runtime state untouched (SPEC-008 SC-006).
#    delete: run the blocking pre-delete teardown — quiesce, then purge libvirt
#    domains + ALL host network state (bridges, SNAT / floating-IP / security-group /
#    metadata iptables, dnsmasq, namespaces) + ALL node-local storage under
#    /var/lib/lightstack (VM disks, config-drive ISOs, images, volumes) + release PVCs.
#    IRREVERSIBLE on the node. Single-node only today; multi-node host purge is
#    tracked in issue #52. The external DATABASE is operator-owned — read to
#    enumerate, NEVER reset; networked backends (Ceph RBD / S3) are NOT purged.
dataRetentionPolicy: retain   # retain | delete

# -- Teardown hook settings. Effective ONLY when dataRetentionPolicy: delete (SPEC-010).
teardown:
  # -- REQUIRED when delete. kubectl image for the quiesce/PVC-delete hook Job
  #    (scale the Deployment to 0, delete release PVCs). No implicit pull —
  #    install/uninstall fails fast if empty under delete (FR-018, R1).
  #    MUST contain /bin/sh (the hook runs a shell script) — distroless images
  #    such as rancher/kubectl fail with StartError; use e.g. alpine/k8s:1.31.0.
  kubectlImage: ""            # e.g. alpine/k8s:1.31.0  (must ship /bin/sh + kubectl)
  # -- Blocking-hook bound: purge Job activeDeadlineSeconds (FR-016).
  timeoutSeconds: 600
  # -- Delete release-owned PVCs during teardown, if any exist (FR-005).
  deletePVCs: true

# -- Observability (FR-013a).
logging:
  level: info                 # debug | info | warn | error
  format: json                # json | text

# -- Kubernetes health probes (SPEC-013). Served unauthenticated on the identity
#    port: /readyz (DB-gated readiness), /livez (process-up liveness), and the
#    OpenStack /healthcheck alias. Paths are fixed — tune timing/thresholds only.
#    Defaults: ~150s startup grace, ~30s readiness-failure detection, ~60s
#    liveness-failure restart.
probes:
  startup:                      # gates on /readyz; tolerates a slow DB connect at boot
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30        # 30 × 5s ≈ 150s boot grace before CrashLoopBackOff
  readiness:                    # gates Service traffic on /readyz (DB reachable + listeners up)
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3         # ≈30s to leave the Service after the DB drops
    successThreshold: 1
  liveness:                     # /livez — process-up only; never gates on the DB
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3         # ≈60s to restart a wedged process

# -- Graceful-shutdown drain (SPEC-013 FR-009). On SIGTERM Lightstack reports not-ready
#    and waits drainSeconds (so the EndpointSlice deregisters) before stopping —
#    for zero-drop rolling updates. 0 = off (in-flight requests are still drained
#    by the graceful shutdown). terminationGracePeriodSeconds MUST exceed it.
drainSeconds: 0
terminationGracePeriodSeconds: 30

# -- Pod resources / scheduling.
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
