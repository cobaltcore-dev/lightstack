{{- if include "lightstack.consoleProxyDeployed" . }}
{{/*
  noVNC console proxy (SPEC-021 / cloud-storage#534, finding F1).

  Lightstack writes NO relay code. The pinned upstream noVNC image already bundles
  websockify and its token plugins, so the default entrypoint
  (`novnc_proxy --vnc $VNC_SERVER`, a single fixed target with no token support —
  which is what made the old console a dead placeholder) is replaced by
  websockify itself, serving the bundled client AND resolving one token per
  connection.

  Lightstack's only job is keeping <hostStoragePath>/console-tokens truthful. Each
  entry names the guest's VNC unix socket, which libvirt creates per start under
  consoleProxy.libvirtDomainDir.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lightstack.fullname" . }}-console-proxy
  labels:
    {{- include "lightstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-proxy
spec:
  # The token projection is node-local, so a second replica on another node
  # would refuse every token it was handed.
  replicas: 1
  selector:
    matchLabels:
      {{- include "lightstack.consoleProxySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lightstack.consoleProxySelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console-proxy
    spec:
      # Not needed to reach the guest any more: its console is a unix socket, reached
      # through the libvirt-domains mount below. Kept so the proxy answers on the
      # node's own address at the console port — the origin Lightstack derives when
      # nova.consoleProxyBaseUrl is empty (deriveConsoleOrigin).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Pin to the Lightstack pod's node, not to a node name: the token directory is
      # node-local, and a nodeSelector would strand the proxy reading an empty
      # directory on the wrong host if Lightstack were ever rescheduled. Required, not
      # preferred — a preferred rule would schedule anyway and fail every token.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "lightstack.selectorLabels" . | nindent 18 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console-proxy
          image: "{{ .Values.consoleProxy.image.repository }}{{ with .Values.consoleProxy.image.digest }}@{{ . }}{{ else }}:{{ .Values.consoleProxy.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.consoleProxy.image.pullPolicy }}
          {{- with .Values.consoleProxy.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Replaces the image's default entrypoint. Notes on the flags:
          #   --web            serve the bundled noVNC client from the same port
          #   --token-plugin   TokenFile, NOT ReadOnlyTokenFile: the read-only
          #                    variant caches on first use and would keep serving
          #                    revoked tokens, silently voiding expiry
          #   --idle-timeout   defaults to 0 (disabled); without it an abandoned
          #                    browser tab holds a guest console open forever
          #   NO --host-token  it would let a client choose the target host
          #                    instead of the token doing so (FR-012)
          command:
            - /bin/sh
            - -c
            - >-
              cd /root/noVNC/utils/websockify &&
              exec python3 -m websockify
              --web /root/noVNC
              --token-plugin TokenFile
              --token-source {{ .Values.realMode.hostStoragePath }}/console-tokens
              --idle-timeout {{ .Values.consoleProxy.idleTimeoutSeconds }}
              {{ .Values.consoleProxy.service.port }}
          ports:
            - name: console
              containerPort: {{ .Values.consoleProxy.service.port }}
              hostPort: {{ .Values.consoleProxy.service.port }}
          volumeMounts:
            # Read-only: the proxy resolves tokens, it never mints or revokes
            # them. Anything that writes here is a bug.
            #
            # Deliberately the whole storage root, not `subPath: console-tokens`.
            # A subPath bind resolves to one inode when the container starts, so a
            # token directory deleted and recreated on the host — which node-local
            # teardown does — would leave the proxy reading the orphaned inode
            # until the pod restarts, and nothing would report it: TokenFile
            # re-reads per lookup rather than failing at startup, and the page probe
            # stays green. Mounting the parent keeps a live view.
            #
            # Accepted cost: the proxy can read the node's other Lightstack state
            # (instances/, volumes/, images/, cloud-init/) read-only. Bounded by
            # readOnly and by the fact that it is pinned to the node whose Lightstack pod
            # already has all of it read-write and privileged.
            - name: host-storage
              mountPath: {{ .Values.realMode.hostStoragePath }}
              readOnly: true
            # Where libvirt creates each running guest's VNC socket
            # (domain-<id>-<name>/vnc.sock). The token names that exact path, so it
            # is mounted at the same place. Read-only is enough: connect() on a
            # socket is not a write to the filesystem.
            - name: libvirt-domains
              mountPath: {{ .Values.consoleProxy.libvirtDomainDir }}
              readOnly: true
          # Honest probes, same principle as the lightstack container's /readyz and /livez
          # (SPEC-013): hit something only a working process can answer.
          #
          # httpGet, NOT tcpSocket. The kernel completes the TCP handshake from the
          # listen backlog whether or not the process ever calls accept(), so a
          # tcpSocket probe passes against a wedged websockify — verified by freezing
          # the pinned image: tcpSocket succeeded, httpGet timed out. GETting the
          # client page exercises accept -> route -> respond, and it is the exact
          # resource the browser loads (consoleClientPage in internal/nova/console.go),
          # so a passing probe means a usable console rather than an open socket.
          {{- with .Values.consoleProxy.probes.readiness }}
          {{- if .enabled }}
          readinessProbe:
            httpGet: { path: /vnc_lite.html, port: console }
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
            successThreshold: {{ .successThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.consoleProxy.probes.liveness }}
          {{- if .enabled }}
          # Deliberately slower and more forgiving than readiness: a transient stall
          # should drop the proxy out of the Service, not restart it and kill every
          # console session on the node.
          livenessProbe:
            httpGet: { path: /vnc_lite.html, port: console }
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.consoleProxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: host-storage
          hostPath:
            path: {{ .Values.realMode.hostStoragePath }}
            type: DirectoryOrCreate
        # Directory, not DirectoryOrCreate: a real-mode node without libvirt's state
        # directory has no guests to show, and should fail here rather than later.
        - name: libvirt-domains
          hostPath:
            path: {{ .Values.consoleProxy.libvirtDomainDir }}
            type: Directory
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lightstack.fullname" . }}-console-proxy
  labels:
    {{- include "lightstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-proxy
spec:
  type: {{ .Values.consoleProxy.service.type }}
  selector:
    {{- include "lightstack.consoleProxySelectorLabels" . | nindent 4 }}
  ports:
    - name: console
      port: {{ .Values.consoleProxy.service.port }}
      targetPort: {{ .Values.consoleProxy.service.port }}
      protocol: TCP
      {{- if eq .Values.consoleProxy.service.type "NodePort" }}
      nodePort: {{ .Values.consoleProxy.service.nodePort }}
      {{- end }}
{{- end }}
