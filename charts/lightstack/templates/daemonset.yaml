{{- if eq .Values.deploymentMode "multi-node" }}
{{- /*
  Multi-node: one identical lightstack instance per designation-labeled node (FR-004/005a).
  Instances self-register and coordinate only through the shared DB. Applying/removing
  the node label starts/evicts an instance with no chart upgrade.
  NOTE (issue #52): correct cross-node VM lifecycle relies on the WS-1 post-condition;
  the DaemonSet deploys now, full multi-node function lands with the post-conditions.
*/ -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "lightstack.fullname" . }}
  labels:
    {{- include "lightstack.labels" . | nindent 4 }}
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "lightstack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lightstack.selectorLabels" . | nindent 8 }}
      {{- if not .Values.secrets.existingSecret }}
      annotations:
        # Roll the pod when the chart-rendered config changes. Omitted when an
        # external Secret is used — the chart can't hash a Secret it doesn't render,
        # so rollout on change is the operator's responsibility there.
        checksum/config: {{ include "lightstack.config" . | sha256sum }}
      {{- end }}
    spec:
      {{- include "lightstack.podSpec" . | nindent 6 }}
{{- end }}
