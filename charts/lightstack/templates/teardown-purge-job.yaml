{{- /*
Teardown purge hook (SPEC-010): the blocking, fail-closed gate — runs `lightstack cleanup`
with real-mode host access; a non-zero exit halts uninstall. hook-weight 0, after quiesce.
*/ -}}
{{- if eq .Values.dataRetentionPolicy "delete" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lightstack.teardown.fullname" . }}-purge
  labels:
    {{- include "lightstack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.teardown.timeoutSeconds }}
  template:
    metadata:
      labels:
        # Distinct from the workload's selectorLabels (no app.kubernetes.io/name) so a
        # workload-pod wait never matches this hook pod (cf. the quiesce Job).
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: teardown-purge
    spec:
      restartPolicy: Never
      {{- /* Node-placed like the workload so the purge reaches the node-local database (SPEC-029
             FR-010), but WITHOUT the workload's pod affinity: the quiesce hook has already scaled
             the workload to zero, so a required pod-affinity on live workload pods would leave the
             purge unschedulable and hang the uninstall. `with … trim` keeps an empty scheduling
             block from leaving a trailing-whitespace line. */}}
      {{- with (include "lightstack.schedulingNodeOnly" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if and .Values.realMode.enabled .Values.realMode.hostNetwork }}
      hostNetwork: true
      {{- end }}
      containers:
        - name: purge
          image: {{ include "lightstack.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/lightstack", "cleanup", "--config", "/app/config/lightstack.yaml"]
          env:
            {{- /* Always set, so a Secret-hidden scheme mismatch is refused (SPEC-029 FR-003). */}}
            {{- include "lightstack.dbBackendEnv" . | nindent 12 }}
            {{- with include "lightstack.dbUrlEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- if .Values.realMode.enabled }}
          securityContext:
            privileged: {{ .Values.realMode.privileged }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- if .Values.realMode.enabled }}
            - name: libvirt-run
              mountPath: {{ dir .Values.realMode.libvirtSocketPath }}
            {{- end }}
            {{- if or .Values.realMode.enabled (include "lightstack.sqliteEnabled" .) }}
            # The node-local state root. The purge removes every tree under it, including the
            # SQLite database directory the database.url names. It must be the state root, not
            # that directory itself: `lightstack cleanup` RemoveAll's it, which cannot be
            # unlinked when it is the mountpoint (SPEC-029).
            - name: host-storage
              mountPath: {{ .Values.realMode.hostStoragePath }}
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "lightstack.configSecretName" . }}
        {{- if .Values.realMode.enabled }}
        # The socket's directory, like the lightstack pod (see lightstack.podSpec).
        - name: libvirt-run
          hostPath:
            path: {{ dir .Values.realMode.libvirtSocketPath }}
            type: Directory
        {{- end }}
        {{- if or .Values.realMode.enabled (include "lightstack.sqliteEnabled" .) }}
        - name: host-storage
          hostPath:
            path: {{ .Values.realMode.hostStoragePath }}
            type: DirectoryOrCreate
        {{- end }}
{{- end }}
