{{- /*
Teardown quiesce + PVC-delete hook (SPEC-009 / issue #53). Renders ONLY under
dataRetentionPolicy=delete. Pre-delete hook-weight -10: runs after RBAC (-20) and
before the o3k purge Job (0). Uses an operator-supplied kubectl image (no implicit
pull, FR-018/R1) to scale the single-node Deployment to 0 (quiesce, FR-019/C6) so
no instance serves or reconciles during the purge, then delete release PVCs
(FR-005). Multi-node DaemonSet quiesce is out of scope here — [DEFERRED #52].
*/ -}}
{{- if eq .Values.dataRetentionPolicy "delete" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "o3k.teardown.fullname" . }}-quiesce
  labels:
    {{- include "o3k.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.teardown.timeoutSeconds }}
  template:
    metadata:
      labels:
        {{- include "o3k.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "o3k.teardown.fullname" . }}
      restartPolicy: Never
      containers:
        - name: quiesce
          image: {{ include "o3k.teardown.kubectlImage" . }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "teardown: quiescing {{ include "o3k.fullname" . }} (scale Deployment to 0)…"
              kubectl scale deployment {{ include "o3k.fullname" . }} \
                --replicas=0 --namespace {{ .Release.Namespace }} --ignore-not-found
              echo "teardown: waiting for pods to terminate…"
              kubectl wait --for=delete pod \
                --selector app.kubernetes.io/instance={{ .Release.Name }} \
                --namespace {{ .Release.Namespace }} \
                --timeout={{ .Values.teardown.timeoutSeconds }}s || true
              {{- if .Values.teardown.deletePVCs }}
              echo "teardown: deleting release PVCs (Helm does not, FR-005)…"
              kubectl delete pvc \
                --selector app.kubernetes.io/instance={{ .Release.Name }} \
                --namespace {{ .Release.Namespace }} --ignore-not-found
              {{- end }}
{{- end }}
