{{- if eq .Values.deploymentMode "single-node" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "o3k.fullname" . }}
  labels:
    {{- include "o3k.labels" . | nindent 4 }}
spec:
  # Real mode pins one replica (privileged + hostNetwork + host ports cannot overlap);
  # stub mode may scale (all state in the DB). FR-003b.
  replicas: {{ if .Values.realMode.enabled }}1{{ else }}{{ .Values.replicaCount }}{{ end }}
  {{- if .Values.realMode.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "o3k.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "o3k.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "o3k.config" . | sha256sum }}
    spec:
      {{- include "o3k.podSpec" . | nindent 6 }}
{{- end }}
