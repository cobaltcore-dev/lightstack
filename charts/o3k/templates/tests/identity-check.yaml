apiVersion: v1
kind: Pod
metadata:
  name: {{ include "o3k.fullname" . }}-identity-check
  labels:
    {{- include "o3k.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: identity-check
      image: {{ include "o3k.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # Confirm the identity service answers (FR-015). The o3k image ships curl.
      command: ["/bin/sh", "-c"]
      args:
        - >-
          curl -fsS http://{{ include "o3k.fullname" . }}:35357/v3 >/dev/null
          && echo "identity endpoint OK" || (echo "identity endpoint FAILED"; exit 1)
  {{- with .Values.image.pullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
