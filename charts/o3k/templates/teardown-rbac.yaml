{{- /*
Teardown RBAC (SPEC-010): least-privilege, release-scoped SA+Role+RoleBinding for the
quiesce/PVC hook (hook-weight -20, before the Jobs). The purge Job needs none — host+DB only.
*/ -}}
{{- if eq .Values.dataRetentionPolicy "delete" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "o3k.teardown.fullname" . }}
  labels:
    {{- include "o3k.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "o3k.teardown.fullname" . }}
  labels:
    {{- include "o3k.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]   # `kubectl scale` patches the scale subresource, not the deployment (quiesce, C6)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]            # wait for termination
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]  # delete release PVCs (FR-005)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "o3k.teardown.fullname" . }}
  labels:
    {{- include "o3k.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "o3k.teardown.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "o3k.teardown.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
