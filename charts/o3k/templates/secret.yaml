{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "o3k.fullname" . }}-config
  labels:
    {{- include "o3k.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Full product config (incl. credentials) — mounted at the binary's --config path.
  # Kept in a Secret because the binary has no per-key env override for the admin
  # password (research R2 / FR-006a).
  o3k.yaml: |
{{ include "o3k.config" . | indent 4 }}
{{- end }}
