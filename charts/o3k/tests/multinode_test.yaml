# helm-unittest specs for multi-node rendering (T018, FR-004/005a/009d).
suite: multi-node DaemonSet render
set:
  image.repository: ghcr.io/o3k/o3k
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
  database.url: postgres://o3k@db/o3k
  deploymentMode: multi-node
tests:
  - it: renders a DaemonSet scheduled on the designation label
    templates:
      - templates/daemonset.yaml
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: spec.template.spec.nodeSelector["o3k.io/compute"]
          value: "true"
  - it: does not render the single-node Deployment in multi-node mode
    templates:
      - templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: enables the VXLAN overlay in the rendered config
    templates:
      - templates/secret.yaml
    asserts:
      - matchRegex:
          path: stringData["o3k.yaml"]
          pattern: "vxlan_enabled: true"
