# helm-unittest specs for the optional-TLS path (T010, FR-008b).
suite: tls / catalog scheme
templates:
  - templates/deployment.yaml
set:
  image.repository: ghcr.io/o3k/o3k
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
  database.url: postgres://o3k@db/o3k
tests:
  - it: sets O3K_ENDPOINT_SCHEME=https when tls.enabled
    set:
      tls.enabled: true
      tls.secretName: o3k-cert
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: O3K_ENDPOINT_SCHEME
            value: "https"
  - it: emits no env block at all by default (no empty env key)
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env
  - it: does not set the https scheme when only the endpoint host is configured
    set:
      endpointHost: o3k.example.com
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: O3K_ENDPOINT_SCHEME
            value: "https"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: O3K_ENDPOINT_HOST
            value: "o3k.example.com"
