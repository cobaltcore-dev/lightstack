# helm-unittest specs for the multi-node storage + cache gates (T019, FR-012e/006a).
# (The cache "single shared Redis" reminder is surfaced via NOTES.txt — Helm has no
#  native warn — so it is not asserted here; the redisUrl-required gate is covered.)
suite: multi-node storage + cache gates
templates:
  - templates/service.yaml
set:
  image.repository: ghcr.io/o3k/o3k
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
  database.url: postgres://o3k@db/o3k
  deploymentMode: multi-node
  realMode.enabled: true
tests:
  - it: rejects local glance/cinder backends in multi-node real (FR-012e)
    set:
      glance.storageMode: local
      cinder.storageMode: local
    asserts:
      - failedTemplate:
          errorPattern: "FR-012e"
  - it: accepts rbd glance + rbd cinder
    set:
      glance.storageMode: rbd
      cinder.storageMode: rbd
    asserts:
      - hasDocuments:
          count: 1
  - it: accepts s3 glance + rbd cinder
    set:
      glance.storageMode: s3
      cinder.storageMode: rbd
    asserts:
      - hasDocuments:
          count: 1
  - it: requires redisUrl when cache is enabled (FR-006a)
    set:
      glance.storageMode: rbd
      cinder.storageMode: rbd
      cache.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "cache.enabled requires cache.redisUrl"
