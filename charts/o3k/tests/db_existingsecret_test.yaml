# helm-unittest specs for DB-URL-from-existing-Secret + ServiceAccount hardening
# (PR #54 review C4). database.existingSecret must inject O3K_DB_URL via secretKeyRef,
# and the pod must never mount a ServiceAccount token (O3K never calls the k8s API).
suite: database existingSecret + automount
templates:
  - templates/deployment.yaml
set:
  image.repository: ghcr.io/o3k/o3k
  secrets.jwtSecret: jwt
  secrets.adminPassword: pw
tests:
  - it: injects O3K_DB_URL from database.existingSecret (default key 'url')
    set:
      database.existingSecret: my-db-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: O3K_DB_URL
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: url
  - it: honors a custom database.existingSecretKey
    set:
      database.existingSecret: my-db-secret
      database.existingSecretKey: dburl
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: O3K_DB_URL
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: dburl
  - it: never mounts a ServiceAccount token
    set:
      database.url: postgres://o3k@db/o3k
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
