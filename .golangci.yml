version: "2"
linters:
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
        path: test/
      # The RBD calls reach stubs that always fail: ceph_rbd_stub.go without -tags ceph,
      # and image_store.go until go-ceph is wired in. Their error checks are right for
      # the real implementations, which staticcheck cannot see.
      - linters:
          - staticcheck
        path: pkg/storage/(ceph|image_store)\.go
        text: SA4023
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
